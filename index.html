<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Titkos Galéria</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Galéria">
    <link rel="apple-touch-icon" href="./appstore.png">
    
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --primary: #0a84ff; --danger: #ff453a; --success: #32d74b; --warning: #ff9f0a; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; text-align: center; }
        
        button, input { touch-action: manipulation; }

        .view { display: none; max-width: 500px; margin: 0 auto; padding-top: 20px; }
        .active { display: block; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        input[type="password"] { width: 100%; padding: 15px; font-size: 20px; text-align: center; border-radius: 10px; border: none; box-sizing: border-box; margin-bottom: 15px; background: #333; color: white; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: bold; margin-bottom: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button.secondary { background: #333; }
        button.danger { background: var(--danger); }
        button.warning { background: var(--warning); }
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; margin-bottom: 15px; }
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }
        .file-upload-btn { background: var(--primary); color: white; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; display: block; width: 100%; box-sizing: border-box; }
        
        #gallery-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 80px; }
        .img-card { position: relative; width: 100%; height: 150px; border-radius: 10px; overflow: hidden; border: 1px solid #333; background: #222; }
        .img-card img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        .img-card input[type="checkbox"] { position: absolute; top: 10px; right: 10px; width: 25px; height: 25px; z-index: 10; accent-color: var(--primary); }
        
        .gallery-actions { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; display: flex; gap: 10px; z-index: 100; }
        .gallery-actions button { margin-bottom: 0; font-size: 14px; padding: 10px; }
        #status-msg { color: var(--success); font-size: 14px; margin-top: 10px; height: 20px; }

        #fullscreen-view { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000000; z-index: 200; display: none; 
            align-items: center; justify-content: center; overflow: hidden; 
        }
        #fullscreen-view.active { display: flex; }
        #fs-img { max-width: 100%; max-height: 100%; object-fit: contain; z-index: 201; }
        .fs-close { 
            position: absolute; top: calc(env(safe-area-inset-top, 20px) + 10px); right: 20px; 
            background: rgba(255,255,255,0.2); border: none; color: white; font-size: 18px; 
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 203; 
            display: flex; align-items: center; justify-content: center; padding: 0;
        }
        #fs-loader { position: absolute; color: white; font-size: 16px; z-index: 202; display: none; }
    </style>
</head>
<body>

    <div id="login-view" class="view active">
        <h1>🔒 Titkos Galéria</h1>
        <p id="login-text">Add meg a jelszavad</p>
        <input type="password" id="pin-input" placeholder="Jelszó...">
        <button onclick="login()">Belépés</button>
        <div id="status-msg"></div>
    </div>

    <div id="menu-view" class="view">
        <h1>Főmenü</h1>
        <button onclick="showView('upload-view')">📸 Új kép hozzáadása</button>
        <button onclick="showView('import-view')">📥 Képek importálása</button>
        <button onclick="openGallery()">🖼️ Képek megtekintése</button>
        <button class="danger" onclick="logout()">Kijelentkezés</button>
    </div>

    <div id="import-view" class="view">
        <h1>📥 Importálás</h1>
        <p style="font-size: 14px; color: gray;">Válaszd ki a kapott titkosított fájlt, majd add meg a feladó jelszavát!</p>
        
        <div class="file-upload-wrapper">
            <button class="file-upload-btn">Titkosított fájl kiválasztása</button>
            <input type="file" accept=".json,application/json" id="import-file-input" onchange="loadImportFile(event)">
        </div>
        <p id="import-filename" style="font-size: 14px; color: var(--primary); margin-bottom: 15px;"></p>
        
        <input type="password" id="import-pin" placeholder="A feladó jelszava...">
        <button class="warning" onclick="processImport()">Importálás és Feloldás</button>
        <p id="import-status" style="font-size: 14px; color: var(--primary);"></p>
        <button class="secondary" onclick="showView('menu-view')">Vissza a menübe</button>
    </div>

    <div id="upload-view" class="view">
        <h1>Kép titkosítása</h1>
        <div class="file-upload-wrapper">
            <button class="file-upload-btn">Kiválasztás vagy Fotózás</button>
            <input type="file" accept="image/*" id="image-input" multiple onchange="handleImage(event)">
        </div>
        <p id="upload-status" style="font-size: 14px; color: gray;">Várakozás képre...</p>
        <button class="secondary" onclick="showView('menu-view')">Vissza a menübe</button>
    </div>

    <div id="gallery-view" class="view">
        <h1>Titkos Képeim</h1>
        <div id="gallery-container"></div>
        <div class="gallery-actions">
            <button class="secondary" onclick="showView('menu-view')">Vissza</button>
            <button class="warning" id="export-btn" style="display:none;" onclick="exportSelected()">Küldés</button>
            <button class="danger" id="delete-btn" style="display:none;" onclick="deleteSelected()">Törlés</button>
        </div>
    </div>

    <div id="fullscreen-view">
        <button class="fs-close" onclick="closeFullscreen()">✕</button>
        <div id="fs-loader">Betöltés...</div>
        <img id="fs-img" src="">
    </div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                reg.onupdatefound = () => {
                    const installingWorker = reg.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    };
                };
            });
        });
    }

    let sessionKey = null; 
    let db;
    let currentGalleryIds = []; 
    let currentImgIndex = 0;       

    const request = indexedDB.open("SecureGalleryDB", 1);
    request.onupgradeneeded = (e) => {
        let db = e.target.result;
        if (!db.objectStoreNames.contains('images')) {
            db.createObjectStore('images', { autoIncrement: true });
        }
    };
    request.onsuccess = (e) => { db = e.target.result; };

    async function deriveKey(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), {name: "PBKDF2"}, false, ["deriveBits", "deriveKey"]);
        return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
            keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
        );
    }

    async function encryptData(dataString, password) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveKey(password, salt);
        const enc = new TextEncoder();
        const encrypted = await crypto.subtle.encrypt({name: "AES-GCM", iv: iv}, key, enc.encode(dataString));
        return { salt: Array.from(salt), iv: Array.from(iv), data: Array.from(new Uint8Array(encrypted)) }; 
    }

    async function decryptData(encryptedObj, password) {
        try {
            const salt = new Uint8Array(encryptedObj.salt);
            const iv = new Uint8Array(encryptedObj.iv);
            const data = new Uint8Array(encryptedObj.data);
            
            const key = await deriveKey(password, salt);
            const decrypted = await crypto.subtle.decrypt({name: "AES-GCM", iv: iv}, key, data);
            const dec = new TextDecoder();
            return dec.decode(decrypted);
        } catch (e) { return null; }
    }

    function generateThumbnail(base64Image, maxWidth = 300) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const scale = Math.min(maxWidth / img.width, 1);
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.5)); 
            };
            img.src = base64Image;
        });
    }

    window.onload = () => {
        if(!localStorage.getItem('appSetup')) {
            document.getElementById('login-text').innerText = "Hozd létre a mesterjelszavad";
        }
    };

    function showView(viewId) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById('fullscreen-view').classList.remove('active'); 
        document.getElementById(viewId).classList.add('active');
    }

    async function login() {
        const pin = document.getElementById('pin-input').value;
        if (!pin) return;

        if (!localStorage.getItem('appSetup')) {
            const verificationToken = await encryptData("OK", pin);
            localStorage.setItem('appSetup', JSON.stringify(verificationToken));
            sessionKey = pin;
            showView('menu-view');
        } else {
            const savedToken = JSON.parse(localStorage.getItem('appSetup'));
            const result = await decryptData(savedToken, pin);
            if (result === "OK") {
                sessionKey = pin;
                showView('menu-view');
            } else { alert("Hibás jelszó!"); }
        }
        document.getElementById('pin-input').value = '';
    }

    function logout() {
        sessionKey = null;
        currentGalleryIds = [];
        showView('login-view');
    }

    async function handleImage(event) {
        const files = event.target.files;
        if (!files.length) return;
        
        document.getElementById('upload-status').innerText = `${files.length} kép titkosítása...`;
        
        for (let file of files) {
            await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const originalBase64 = e.target.result;
                    const thumbBase64 = await generateThumbnail(originalBase64);
                    
                    const encryptedFull = await encryptData(originalBase64, sessionKey);
                    const encryptedThumb = await encryptData(thumbBase64, sessionKey);
                    
                    const payload = {
                        version: 2, 
                        full: encryptedFull,
                        thumb: encryptedThumb
                    };

                    const transaction = db.transaction(['images'], 'readwrite');
                    transaction.objectStore('images').add(payload);
                    transaction.oncomplete = resolve;
                };
                reader.readAsDataURL(file);
            });
        }
        
        document.getElementById('upload-status').innerText = "Várakozás képre...";
        alert("Sikeres mentés!");
        showView('menu-view');
    }

    function openGallery() {
        showView('gallery-view');
        const container = document.getElementById('gallery-container');
        container.innerHTML = '<p>Adatok olvasása...</p>';
        updateSelectionBtns();
        currentGalleryIds = []; 

        const transaction = db.transaction(['images'], 'readonly');
        const store = transaction.objectStore('images');
        
        const reqValues = store.getAll();
        const reqKeys = store.getAllKeys();

        transaction.oncomplete = () => {
            const values = reqValues.result;
            const keys = reqKeys.result;

            if (!values || values.length === 0) {
                container.innerHTML = '<p style="grid-column: span 2;">Üres a galéria.</p>';
                return;
            }

            const records = values.map((val, i) => ({ key: keys[i], value: val }));
            processAndRenderImages(records, container);
        };
    }

    async function processAndRenderImages(records, container) {
        container.innerHTML = '<p id="loading-text" style="grid-column: span 2;">Képek dekódolása...</p>';

        for (let record of records) {
            let dataToDecrypt = record.value;
            if (record.value.version === 2) {
                dataToDecrypt = record.value.thumb; 
            }

            const base64Thumb = await decryptData(dataToDecrypt, sessionKey);
            
            if (base64Thumb) {
                const index = currentGalleryIds.length;
                currentGalleryIds.push(record.key); 
                
                const card = document.createElement('div');
                card.className = 'img-card';
                card.innerHTML = `
                    <input type="checkbox" value="${record.key}" onchange="updateSelectionBtns()">
                    <img src="${base64Thumb}" onclick="openFullscreen(${index})">
                `;
                container.appendChild(card);
            }
        }
        
        const loadingText = document.getElementById('loading-text');
        if(loadingText) loadingText.remove();
    }

    function updateSelectionBtns() {
        const selected = document.querySelectorAll('#gallery-container input:checked');
        const delBtn = document.getElementById('delete-btn');
        const expBtn = document.getElementById('export-btn');
        
        if (selected.length > 0) {
            delBtn.style.display = 'block';
            expBtn.style.display = 'block';
            delBtn.innerText = `Törlés (${selected.length})`;
            expBtn.innerText = `Küldés (${selected.length})`;
        } else {
            delBtn.style.display = 'none';
            expBtn.style.display = 'none';
        }
    }

    // --- KÉPEK KÜLDÉSE (EXPORT) ---
    async function exportSelected() {
        const selected = document.querySelectorAll('#gallery-container input:checked');
        if (selected.length === 0) return;

        const transaction = db.transaction(['images'], 'readonly');
        const store = transaction.objectStore('images');
        let exportData = [];

        for (let cb of selected) {
            const id = Number(cb.value);
            await new Promise(resolve => {
                const request = store.get(id);
                request.onsuccess = (e) => {
                    exportData.push(e.target.result);
                    resolve();
                };
            });
        }

        const blob = new Blob([JSON.stringify(exportData)], { type: 'application/json' });
        const file = new File([blob], 'titkositott_kepek.json', { type: 'application/json' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({
                files: [file],
                title: 'Titkos Képek',
                text: 'Ezek a képek titkosítva lettek.'
            }).catch(err => console.log('Megosztás megszakítva', err));
        } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'titkositott_kepek.json';
            a.click();
            URL.revokeObjectURL(url);
        }
        
        document.querySelectorAll('#gallery-container input:checked').forEach(cb => cb.checked = false);
        updateSelectionBtns();
    }

    // --- KÉPEK FOGADÁSA ÉS ÁTKÓDOLÁSA (IMPORT) ---
    let pendingImportData = null;

    function loadImportFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        document.getElementById('import-filename').innerText = file.name;
        
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                pendingImportData = JSON.parse(e.target.result);
            } catch (err) {
                alert("Érvénytelen fájlformátum! Csak az ebből az appból küldött json fájl működik.");
                pendingImportData = null;
            }
        };
        reader.readAsText(file);
    }

    async function processImport() {
        if (!pendingImportData) {
            alert("Előbb válassz ki egy kapott fájlt!");
            return;
        }
        const senderPin = document.getElementById('import-pin').value;
        if (!senderPin) {
            alert("Írd be a feladó jelszavát!");
            return;
        }

        const statusEl = document.getElementById('import-status');
        statusEl.innerText = "Feldolgozás és Átkódolás folyamatban...";

        let successCount = 0;
        let failCount = 0;

        for (let record of pendingImportData) {
            let dataToDecrypt = record;
            if (record.version === 2) {
                dataToDecrypt = record.full; 
            }

            const base64Full = await decryptData(dataToDecrypt, senderPin);

            if (base64Full) {
                const thumbBase64 = await generateThumbnail(base64Full);
                const encryptedFull = await encryptData(base64Full, sessionKey);
                const encryptedThumb = await encryptData(thumbBase64, sessionKey);
                
                const payload = {
                    version: 2,
                    full: encryptedFull,
                    thumb: encryptedThumb
                };

                await new Promise(resolve => {
                    const transaction = db.transaction(['images'], 'readwrite');
                    transaction.objectStore('images').add(payload);
                    transaction.oncomplete = resolve;
                });
                successCount++;
            } else {
                failCount++;
            }
        }

        statusEl.innerText = "";
        document.getElementById('import-pin').value = '';
        document.getElementById('import-file-input').value = '';
        document.getElementById('import-filename').innerText = '';
        pendingImportData = null;

        alert(`Importálás befejezve!\nSikeresen importálva: ${successCount} kép\nHibás jelszó miatt elutasítva: ${failCount} kép`);
        showView('menu-view');
    }

    // --- TÖRLÉS ---
    async function deleteSelected() {
        if (!confirm("Biztosan törlöd a kijelölt képeket?")) return;
        
        const selected = document.querySelectorAll('#gallery-container input:checked');
        const transaction = db.transaction(['images'], 'readwrite');
        const store = transaction.objectStore('images');

        selected.forEach(cb => {
            store.delete(Number(cb.value)); 
        });

        transaction.oncomplete = () => {
            openGallery();
            alert("Képek törölve!");
        };
    }

    // --- TELJES KÉPERNYŐ ÉS SWIPE ---
    async function loadFullscreenImage(index) {
        const imgEl = document.getElementById('fs-img');
        const loader = document.getElementById('fs-loader');
        
        imgEl.src = "";
        loader.style.display = "block";

        const imageId = currentGalleryIds[index];
        const transaction = db.transaction(['images'], 'readonly');
        const request = transaction.objectStore('images').get(imageId);

        request.onsuccess = async (e) => {
            const record = e.target.result;
            if(record) {
                let dataToDecrypt = record;
                if (record.version === 2) {
                    dataToDecrypt = record.full;
                }

                const base64Full = await decryptData(dataToDecrypt, sessionKey);
                imgEl.src = base64Full;
                loader.style.display = "none";
            }
        };
    }

    function openFullscreen(index) {
        currentImgIndex = index;
        document.getElementById('gallery-view').classList.remove('active');
        document.getElementById('fullscreen-view').classList.add('active');
        loadFullscreenImage(currentImgIndex);
    }

    function closeFullscreen() {
        document.getElementById('fullscreen-view').classList.remove('active');
        document.getElementById('gallery-view').classList.add('active');
        document.getElementById('fs-img').src = ""; 
    }

    function nextFsImage() {
        if (currentImgIndex < currentGalleryIds.length - 1) {
            currentImgIndex++;
            loadFullscreenImage(currentImgIndex);
        }
    }

    function prevFsImage() {
        if (currentImgIndex > 0) {
            currentImgIndex--;
            loadFullscreenImage(currentImgIndex);
        }
    }

    let touchstartX = 0;
    let touchendX = 0;
    let isZooming = false;

    const fsView = document.getElementById('fullscreen-view');

    fsView.addEventListener('touchstart', e => {
        if(e.touches.length > 1) {
            isZooming = true; 
        } else {
            isZooming = false;
            touchstartX = e.changedTouches[0].screenX;
        }
    }, {passive: true});

    fsView.addEventListener('touchend', e => {
        if(!isZooming && e.changedTouches.length === 1) {
            touchendX = e.changedTouches[0].screenX;
            if (touchendX < touchstartX - 40) nextFsImage(); 
            if (touchendX > touchstartX + 40) prevFsImage(); 
        }
    }, {passive: true});
</script>

</body>
</html>
