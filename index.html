<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titkos Galéria</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Galéria">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Apple_logo_black.svg/1024px-Apple_logo_black.svg.png">
    
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --primary: #0a84ff; --danger: #ff453a; --success: #32d74b; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; text-align: center; }
        .view { display: none; max-width: 500px; margin: 0 auto; padding-top: 20px; }
        .active { display: block; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        input[type="password"] { width: 100%; padding: 15px; font-size: 20px; text-align: center; border-radius: 10px; border: none; box-sizing: border-box; margin-bottom: 15px; background: #333; color: white; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: bold; margin-bottom: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button.secondary { background: #333; }
        button.danger { background: var(--danger); }
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; margin-bottom: 15px; }
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }
        .file-upload-btn { background: var(--primary); color: white; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; display: block; width: 100%; box-sizing: border-box; }
        
        /* Galéria stílus */
        #gallery-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 80px; }
        .img-card { position: relative; width: 100%; height: 150px; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
        .img-card img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        .img-card input[type="checkbox"] { position: absolute; top: 10px; right: 10px; width: 25px; height: 25px; z-index: 10; accent-color: var(--primary); }
        
        .gallery-actions { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; display: flex; gap: 10px; z-index: 100; }
        #status-msg { color: var(--success); font-size: 14px; margin-top: 10px; height: 20px; }

        /* Teljes képernyős nézet stílusai */
        #fullscreen-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 200; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #fullscreen-view.active { display: flex; }
        .fs-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); border: none; color: white; font-size: 18px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 201; display: flex; align-items: center; justify-content: center; padding: 0;}
        .fs-nav-container { display: flex; width: 100%; height: 100%; align-items: center; justify-content: space-between; position: relative; }
        .fs-btn { background: transparent; border: none; color: white; font-size: 40px; padding: 20px; cursor: pointer; z-index: 201; width: 80px; }
        #fs-img { max-width: 100%; max-height: 100%; object-fit: contain; flex-grow: 1; user-select: none; }
    </style>
</head>
<body>

    <div id="login-view" class="view active">
        <h1>🔒 Titkos Galéria</h1>
        <p id="login-text">Add meg a jelszavad</p>
        <input type="password" id="pin-input" placeholder="Jelszó...">
        <button onclick="login()">Belépés</button>
        <div id="status-msg"></div>
    </div>

    <div id="menu-view" class="view">
        <h1>Főmenü</h1>
        <button onclick="showView('upload-view')">📸 Új kép hozzáadása</button>
        <button onclick="openGallery()">🖼️ Képek megtekintése</button>
        <button class="danger" onclick="logout()">Kijelentkezés</button>
    </div>

    <div id="upload-view" class="view">
        <h1>Kép titkosítása</h1>
        <div class="file-upload-wrapper">
            <button class="file-upload-btn">Kiválasztás vagy Fotózás</button>
            <input type="file" accept="image/*" id="image-input" multiple onchange="handleImage(event)">
        </div>
        <p id="upload-status" style="font-size: 14px; color: gray;">Várakozás képre...</p>
        <button class="secondary" onclick="showView('menu-view')">Vissza a menübe</button>
    </div>

    <div id="gallery-view" class="view">
        <h1>Titkos Képeim</h1>
        <div id="gallery-container"></div>
        <div class="gallery-actions">
            <button class="secondary" onclick="showView('menu-view')">Vissza</button>
            <button class="danger" id="delete-btn" style="display:none;" onclick="deleteSelected()">Törlés (0)</button>
        </div>
    </div>

    <div id="fullscreen-view" 
         ontouchstart="touchstartX = event.changedTouches[0].screenX" 
         ontouchend="touchendX = event.changedTouches[0].screenX; handleGesture()">
        <button class="fs-close" onclick="closeFullscreen()">✕</button>
        <div class="fs-nav-container">
            <button class="fs-btn" onclick="prevFsImage()">❮</button>
            <img id="fs-img" src="">
            <button class="fs-btn" onclick="nextFsImage()">❯</button>
        </div>
    </div>

<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }

    let sessionKey = null; 
    let db;
    let currentGalleryImages = []; // A kibontott képek tömbje a lapozáshoz
    let currentImgIndex = 0;       // Az éppen nézett kép indexe

    const request = indexedDB.open("SecureGalleryDB", 1);
    request.onupgradeneeded = (e) => {
        let db = e.target.result;
        if (!db.objectStoreNames.contains('images')) {
            db.createObjectStore('images', { keyPath: "id", autoIncrement: true });
        }
    };
    request.onsuccess = (e) => { db = e.target.result; };

    async function deriveKey(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), {name: "PBKDF2"}, false, ["deriveBits", "deriveKey"]);
        return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
            keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
        );
    }

    async function encryptData(dataString, password) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveKey(password, salt);
        const enc = new TextEncoder();
        const encrypted = await crypto.subtle.encrypt({name: "AES-GCM", iv: iv}, key, enc.encode(dataString));
        return { salt: salt, iv: iv, data: new Uint8Array(encrypted) };
    }

    async function decryptData(encryptedObj, password) {
        try {
            const key = await deriveKey(password, encryptedObj.salt);
            const decrypted = await crypto.subtle.decrypt({name: "AES-GCM", iv: encryptedObj.iv}, key, encryptedObj.data);
            const dec = new TextDecoder();
            return dec.decode(decrypted);
        } catch (e) { return null; }
    }

    window.onload = () => {
        if(!localStorage.getItem('appSetup')) {
            document.getElementById('login-text').innerText = "Hozd létre a mesterjelszavad";
        }
    };

    function showView(viewId) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById('fullscreen-view').classList.remove('active'); // Biztosítjuk, hogy ez eltűnjön
        document.getElementById(viewId).classList.add('active');
    }

    async function login() {
        const pin = document.getElementById('pin-input').value;
        if (!pin) return;

        if (!localStorage.getItem('appSetup')) {
            const verificationToken = await encryptData("OK", pin);
            localStorage.setItem('appSetup', JSON.stringify({
                salt: Array.from(verificationToken.salt),
                iv: Array.from(verificationToken.iv),
                data: Array.from(verificationToken.data)
            }));
            sessionKey = pin;
            showView('menu-view');
        } else {
            const savedToken = JSON.parse(localStorage.getItem('appSetup'));
            const verifyObj = {
                salt: new Uint8Array(savedToken.salt),
                iv: new Uint8Array(savedToken.iv),
                data: new Uint8Array(savedToken.data)
            };
            const result = await decryptData(verifyObj, pin);
            if (result === "OK") {
                sessionKey = pin;
                showView('menu-view');
            } else { alert("Hibás jelszó!"); }
        }
        document.getElementById('pin-input').value = '';
    }

    function logout() {
        sessionKey = null;
        currentGalleryImages = [];
        showView('login-view');
    }

    // --- KÉPFELTÖLTÉS ---
    async function handleImage(event) {
        const files = event.target.files;
        if (!files.length) return;
        
        document.getElementById('upload-status').innerText = `${files.length} kép titkosítása...`;
        
        for (let file of files) {
            await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const encryptedPayload = await encryptData(e.target.result, sessionKey);
                    const transaction = db.transaction(['images'], 'readwrite');
                    transaction.objectStore('images').add(encryptedPayload);
                    transaction.oncomplete = resolve;
                };
                reader.readAsDataURL(file);
            });
        }
        
        document.getElementById('upload-status').innerText = "Várakozás képre...";
        alert("Sikeres mentés!");
        showView('menu-view');
    }

    // --- GALÉRIA ÉS TÖRLÉS ---
    async function openGallery() {
        showView('gallery-view');
        const container = document.getElementById('gallery-container');
        container.innerHTML = '<p>Dekódolás...</p>';
        updateDeleteBtn();
        currentGalleryImages = []; // Lista nullázása

        const transaction = db.transaction(['images'], 'readonly');
        const request = transaction.objectStore('images').getAll();

        request.onsuccess = async (e) => {
            const images = e.target.result;
            container.innerHTML = '';

            if (!images.length) {
                container.innerHTML = '<p style="grid-column: span 2;">Üres a galéria.</p>';
                return;
            }

            for (let imgObj of images) {
                const base64 = await decryptData(imgObj, sessionKey);
                if (base64) {
                    const index = currentGalleryImages.length;
                    currentGalleryImages.push(base64); // Eltároljuk a lapozáshoz
                    
                    const card = document.createElement('div');
                    card.className = 'img-card';
                    card.innerHTML = `
                        <input type="checkbox" value="${imgObj.id}" onchange="updateDeleteBtn()">
                        <img src="${base64}" onclick="openFullscreen(${index})">
                    `;
                    container.appendChild(card);
                }
            }
        };
    }

    function updateDeleteBtn() {
        const selected = document.querySelectorAll('#gallery-container input:checked');
        const btn = document.getElementById('delete-btn');
        if (selected.length > 0) {
            btn.style.display = 'block';
            btn.innerText = `Törlés (${selected.length})`;
        } else {
            btn.style.display = 'none';
        }
    }

    async function deleteSelected() {
        if (!confirm("Biztosan törlöd a kijelölt képeket?")) return;
        
        const selected = document.querySelectorAll('#gallery-container input:checked');
        const transaction = db.transaction(['images'], 'readwrite');
        const store = transaction.objectStore('images');

        selected.forEach(cb => {
            store.delete(Number(cb.value));
        });

        transaction.oncomplete = () => {
            openGallery();
            alert("Képek törölve!");
        };
    }

    // --- TELJES KÉPERNYŐS NÉZET ÉS LAPOZÁS ---
    function openFullscreen(index) {
        currentImgIndex = index;
        document.getElementById('fs-img').src = currentGalleryImages[currentImgIndex];
        document.getElementById('gallery-view').classList.remove('active');
        document.getElementById('fullscreen-view').classList.add('active');
    }

    function closeFullscreen() {
        document.getElementById('fullscreen-view').classList.remove('active');
        document.getElementById('gallery-view').classList.add('active');
        document.getElementById('fs-img').src = ""; // Memória felszabadítása
    }

    function nextFsImage() {
        if (currentImgIndex < currentGalleryImages.length - 1) {
            currentImgIndex++;
            document.getElementById('fs-img').src = currentGalleryImages[currentImgIndex];
        }
    }

    function prevFsImage() {
        if (currentImgIndex > 0) {
            currentImgIndex--;
            document.getElementById('fs-img').src = currentGalleryImages[currentImgIndex];
        }
    }

    // Érintőképernyős (Swipe) vezérlés
    let touchstartX = 0;
    let touchendX = 0;
    
    function handleGesture() {
        if (touchendX < touchstartX - 40) nextFsImage(); // Húzás balra -> Következő
        if (touchendX > touchstartX + 40) prevFsImage(); // Húzás jobbra -> Előző
    }
</script>

</body>
</html>
