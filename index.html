<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Titkos Galéria</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Galéria">
    <link rel="apple-touch-icon" href="./appstore.png">
    
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --primary: #0a84ff; --danger: #ff453a; --success: #32d74b; --warning: #ff9f0a; --info: #30d158; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; text-align: center; }
        
        button, input, select, textarea { touch-action: manipulation; }

        .view { display: none; max-width: 500px; margin: 0 auto; padding-top: 20px; position: relative; }
        .active { display: block; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 15px; font-size: 20px; text-align: center; border-radius: 10px; border: none; box-sizing: border-box; margin-bottom: 15px; background: #333; color: white; }
        textarea { width: 100%; height: 250px; padding: 15px; font-size: 16px; border-radius: 10px; border: none; box-sizing: border-box; margin-bottom: 15px; background: #333; color: white; font-family: inherit; resize: vertical; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: bold; margin-bottom: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary { background: #333; }
        button.danger { background: var(--danger); }
        button.warning { background: var(--warning); }
        button.info { background: var(--info); }
        select { width: 100%; padding: 15px; border-radius: 10px; font-size: 16px; background: #333; color: white; border: none; margin-bottom: 15px; box-sizing: border-box; }
        
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; margin-bottom: 15px; }
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }
        .file-upload-btn { background: var(--primary); color: white; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; display: block; width: 100%; box-sizing: border-box; }
        
        #gallery-header, #video-gallery-header { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
        #gallery-header select, #video-gallery-header select { margin-bottom: 0; flex: 1; }
        #gallery-header button, #video-gallery-header button { width: auto; margin-bottom: 0; padding: 12px 15px; }

        #gallery-container, #video-gallery-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 150px; }
        .img-card { position: relative; width: 100%; height: 150px; border-radius: 10px; overflow: hidden; border: 1px solid #333; background: #222; }
        .img-card img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        .img-card input[type="checkbox"] { position: absolute; top: 10px; right: 10px; width: 25px; height: 25px; z-index: 10; accent-color: var(--primary); }
        
        .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; color: rgba(255,255,255,0.8); pointer-events: none; text-shadow: 0 0 10px black; }

        .gallery-actions { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: #1e1e1e; 
            padding: 10px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 5px; 
            justify-content: center; z-index: 100; border-top: 1px solid #333;
            padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 10px);
        }
        .gallery-actions button { flex: 1 1 calc(33% - 10px); font-size: 12px; padding: 10px 5px; margin: 0; }
        
        #status-msg { font-size: 14px; margin-top: 10px; min-height: 20px; }
        #lockout-msg { color: var(--danger); font-size: 16px; font-weight: bold; margin-bottom: 15px; display: none; }

        #secret-dot { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background-color: transparent; border-radius: 50%; z-index: 1000; }

        #notes-list { margin-bottom: 150px; }
        .note-item { background: #222; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #333; display: flex; align-items: center; }
        .note-item span { font-weight: bold; cursor: pointer; flex-grow: 1; text-align: left; }
        
        #fullscreen-view { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000000; z-index: 200; display: none; 
            align-items: center; justify-content: center; overflow: hidden; 
        }
        #fullscreen-view.active { display: flex; }
        #fs-img { max-width: 100%; max-height: 100%; object-fit: contain; z-index: 201; }
        .fs-close { 
            position: absolute; top: calc(env(safe-area-inset-top, 20px) + 10px); right: 20px; 
            background: rgba(255,255,255,0.2); border: none; color: white; font-size: 18px; 
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 203; 
            display: flex; align-items: center; justify-content: center; padding: 0;
        }
        #fs-loader { position: absolute; color: white; font-size: 16px; z-index: 202; display: none; }

        #video-player-view { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000000; z-index: 200; display: none; 
            align-items: center; justify-content: center; overflow: hidden; flex-direction: column;
        }
    </style>
</head>
<body>

    <div id="login-view" class="view active">
        <h1>🔒 Titkos Galéria</h1>
        <p id="lockout-msg"></p>
        <p id="login-text">Add meg a jelszavad</p>
        <input type="password" id="pin-input" placeholder="Jelszó...">
        <button id="login-btn" onclick="login()">Belépés</button>
        <div id="status-msg"></div>
    </div>

    <div id="menu-view" class="view">
        <div id="secret-dot" onclick="handleSecretTap()"></div>
        
        <h1>Főmenü</h1>
        <button onclick="showView('upload-view')">📸 Új fájl hozzáadása</button>
        <button onclick="showView('import-view')">📥 Mentés Importálása</button>
        <button onclick="openGallery()">🖼️ Képek megtekintése</button>
        <button onclick="openVideoGallery()">🎬 Videók megtekintése</button>
        <button class="danger" onclick="logout()">Kijelentkezés</button>
    </div>

    <div id="notes-view" class="view">
        <h1>Titkos Jegyzetek</h1>
        <button onclick="editNote(null)" style="margin-bottom: 15px;">+ Új Jegyzet írása</button>
        <div id="notes-list"></div>
        <div class="gallery-actions">
            <button class="secondary" onclick="showView('menu-view')">Vissza</button>
            <button class="secondary" id="note-select-all-btn" onclick="toggleNoteSelectAll()">Mindet kijelöl</button>
            <button class="info" id="note-save-original-btn" style="display:none;" onclick="saveOriginalNotes()">Kimentés</button>
            <button class="warning" id="note-export-btn" style="display:none;" onclick="exportSelectedNotes()">Küldés</button>
            <button class="danger" id="note-delete-btn" style="display:none;" onclick="deleteSelectedNotes()">Törlés</button>
        </div>
    </div>

    <div id="note-editor-view" class="view">
        <input type="text" id="note-title" placeholder="Jegyzet címe...">
        <textarea id="note-content" placeholder="Ide írd a titkos szöveget..."></textarea>
        <button onclick="saveNote()">Mentés</button>
        <button class="secondary" onclick="openNotes()">Mégsem</button>
    </div>

    <div id="move-view" class="view">
        <h1>Áthelyezés mappába</h1>
        <select id="move-album-select"></select>
        <button onclick="executeMove()">Áthelyezés</button>
        <button class="secondary" onclick="showView('gallery-view')">Mégsem</button>
    </div>

    <div id="video-move-view" class="view">
        <h1>Áthelyezés mappába</h1>
        <select id="video-move-album-select"></select>
        <button onclick="executeVideoMove()">Áthelyezés</button>
        <button class="secondary" onclick="showView('video-gallery-view')">Mégsem</button>
    </div>

    <div id="import-view" class="view">
        <h1>📥 Importálás</h1>
        <div class="file-upload-wrapper">
            <button class="file-upload-btn">Titkosított fájl kiválasztása</button>
            <input type="file" accept=".json,application/json" id="import-file-input" onchange="loadImportFile(event)">
        </div>
        <p id="import-filename" style="font-size: 14px; color: var(--primary); margin-bottom: 15px;"></p>
        <input type="password" id="import-pin" placeholder="Küldési jelszó...">
        <button class="warning" onclick="processImport()">Importálás és Feloldás</button>
        <p id="import-status" style="font-size: 14px; color: var(--primary);"></p>
        <button class="secondary" onclick="showView('menu-view')">Vissza a menübe</button>
    </div>

    <div id="upload-view" class="view">
        <h1>Fájl titkosítása</h1>
        <div class="file-upload-wrapper">
            <button class="file-upload-btn">Kiválasztás vagy Felvétel</button>
            <input type="file" accept="image/*, video/*" id="media-input" multiple onchange="handleMediaUpload(event)">
        </div>
        <p id="upload-status" style="font-size: 14px; color: gray;">Várakozás fájlra...</p>
        <button class="secondary" onclick="showView('menu-view')">Vissza a menübe</button>
    </div>

    <div id="gallery-view" class="view">
        <div id="gallery-header">
            <select id="album-select" onchange="changeAlbum()">
                <option value="ALL">Minden Kép</option>
            </select>
            <button onclick="createAlbum()">+ Új</button>
            <button id="del-album-btn" class="danger" onclick="deleteAlbum()" style="display:none;">Törlés</button>
        </div>

        <div id="gallery-container"></div>
        
        <div class="gallery-actions">
            <button class="secondary" onclick="showView('menu-view')">Vissza</button>
            <button class="secondary" id="select-all-btn" onclick="toggleSelectAll()">Mindet kijelöl</button>
            <button class="primary" id="move-btn" style="display:none;" onclick="showMoveModal()">Mozgatás</button>
            <button class="info" id="save-original-btn" style="display:none;" onclick="saveOriginals()">Kimentés</button>
            <button class="warning" id="export-btn" style="display:none;" onclick="exportSelected()">Küldés</button>
            <button class="danger" id="delete-btn" style="display:none;" onclick="deleteSelected()">Törlés</button>
        </div>
    </div>

    <div id="video-gallery-view" class="view">
        <div id="video-gallery-header">
            <select id="video-album-select" onchange="changeVideoAlbum()">
                <option value="ALL">Minden Videó</option>
            </select>
            <button onclick="createVideoAlbum()">+ Új</button>
            <button id="del-video-album-btn" class="danger" onclick="deleteVideoAlbum()" style="display:none;">Törlés</button>
        </div>

        <div id="video-gallery-container"></div>
        
        <div class="gallery-actions">
            <button class="secondary" onclick="showView('menu-view')">Vissza</button>
            <button class="secondary" id="video-select-all-btn" onclick="toggleVideoSelectAll()">Mindet kijelöl</button>
            <button class="primary" id="video-move-btn" style="display:none;" onclick="showVideoMoveModal()">Mozgatás</button>
            <button class="info" id="video-save-original-btn" style="display:none;" onclick="saveOriginalVideos()">Kimentés</button>
            <button class="warning" id="video-export-btn" style="display:none;" onclick="exportSelectedVideos()">Küldés</button>
            <button class="danger" id="video-delete-btn" style="display:none;" onclick="deleteSelectedVideos()">Törlés</button>
        </div>
    </div>

    <div id="fullscreen-view">
        <button class="fs-close" onclick="closeFullscreen()">✕</button>
        <div id="fs-loader">Betöltés...</div>
        <img id="fs-img" src="">
    </div>

    <div id="video-player-view">
        <button class="fs-close" onclick="closeVideoPlayer()">✕</button>
        <div id="video-loader" style="position: absolute; color: white; font-size: 16px; z-index: 202; display: none; text-align: center;">Betöltés...<br><span id="video-progress">0%</span></div>
        <video id="fs-video" style="max-width: 100%; max-height: 100%; z-index: 201; display: none;" controls playsinline></video>
    </div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                reg.onupdatefound = () => {
                    const installingWorker = reg.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    };
                };
            });
        });
    }

    let sessionKeyMaterial = null; 
    let db;
    let currentGalleryIds = []; 
    let currentImgIndex = 0;       
    let isAllSelected = false;
    let albums = [];
    let lockoutInterval = null;

    let currentVideoGalleryIds = [];
    let isAllVideoSelected = false;
    let activeVideoUrl = null;

    const request = indexedDB.open("SecureGalleryDB", 3);
    request.onupgradeneeded = (e) => {
        let db = e.target.result;
        if (!db.objectStoreNames.contains('images')) db.createObjectStore('images', { autoIncrement: true });
        if (!db.objectStoreNames.contains('notes')) db.createObjectStore('notes', { autoIncrement: true }); 
        if (!db.objectStoreNames.contains('videos')) db.createObjectStore('videos', { autoIncrement: true }); 
        if (!db.objectStoreNames.contains('video_chunks')) {
            let chunkStore = db.createObjectStore('video_chunks', { autoIncrement: true });
            chunkStore.createIndex('videoId', 'videoId', { unique: false });
        }
    };
    request.onsuccess = (e) => { db = e.target.result; };

    function bufferToBase64(buf) {
        return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.readAsDataURL(new Blob([buf]));
        });
    }

    async function base64ToBufferAsync(b64) {
        try {
            const res = await fetch('data:application/octet-stream;base64,' + b64);
            const buf = await res.arrayBuffer();
            return new Uint8Array(buf);
        } catch(e) {
            const binstr = atob(b64);
            const buf = new Uint8Array(binstr.length);
            for (let i = 0; i < binstr.length; i++) { buf[i] = binstr.charCodeAt(i); }
            return buf;
        }
    }

    async function getBase64Safe(data) {
        let safeData = data;
        if (Array.isArray(data)) { safeData = new Uint8Array(data); }
        return await bufferToBase64(safeData);
    }

    function dataURLtoFile(dataurl, filename) {
        var arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
            bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
        while(n--){ u8arr[n] = bstr.charCodeAt(n); }
        return new File([u8arr], filename, {type:mime});
    }

    async function getMasterKeyMaterial(password) {
        const enc = new TextEncoder();
        return await crypto.subtle.importKey(
            "raw", 
            enc.encode(password), 
            {name: "PBKDF2"}, 
            false, 
            ["deriveBits", "deriveKey"]
        );
    }

    const PBKDF2_ITERATIONS = 600000; // új titkosításokhoz; régi (frissítés előtti) adatoknál a tárolt iter mező, vagy ha nincs, 100000 a referencia
    const PBKDF2_ITERATIONS_LEGACY = 100000;

    async function deriveAESKey(keyMaterial, salt, iterations) {
        return await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: iterations, hash: "SHA-256" },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
        );
    }

    async function encryptData(dataBuffer, keyMaterial) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveAESKey(keyMaterial, salt, PBKDF2_ITERATIONS);
        const encrypted = await crypto.subtle.encrypt({name: "AES-GCM", iv: iv}, key, dataBuffer);
        return { salt: salt, iv: iv, data: new Uint8Array(encrypted), iter: PBKDF2_ITERATIONS };
    }

    async function decryptData(encryptedObj, keyMaterial) {
        try {
            const salt = new Uint8Array(encryptedObj.salt);
            const iv = new Uint8Array(encryptedObj.iv);
            const data = new Uint8Array(encryptedObj.data);
            const iterations = encryptedObj.iter || PBKDF2_ITERATIONS_LEGACY; // visszafelé kompatibilitás a frissítés előtt mentett adatokkal
            const key = await deriveAESKey(keyMaterial, salt, iterations);
            const decrypted = await crypto.subtle.decrypt({name: "AES-GCM", iv: iv}, key, data);
            return new Uint8Array(decrypted);
        } catch (e) { return null; }
    }

    async function encryptText(text, keyMaterial) {
        const enc = new TextEncoder();
        const encData = await encryptData(enc.encode(text), keyMaterial);
        return { salt: Array.from(encData.salt), iv: Array.from(encData.iv), data: await bufferToBase64(encData.data), iter: encData.iter };
    }

    async function decryptText(encryptedObj, keyMaterial) {
        try {
            const encData = {
                salt: new Uint8Array(encryptedObj.salt),
                iv: new Uint8Array(encryptedObj.iv),
                data: typeof encryptedObj.data === 'string' ? await base64ToBufferAsync(encryptedObj.data) : new Uint8Array(encryptedObj.data),
                iter: encryptedObj.iter
            };
            const decBuf = await decryptData(encData, keyMaterial);
            if (!decBuf) return null;
            const dec = new TextDecoder();
            return dec.decode(decBuf);
        } catch(e) { return null; }
    }

    function generateThumbnail(base64Image, maxWidth = 300) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const scale = Math.min(maxWidth / img.width, 1);
                canvas.width = img.width * scale; canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const result = canvas.toDataURL('image/jpeg', 0.5);
                canvas.width = 0; canvas.height = 0; img.src = '';
                resolve(result); 
            };
            img.onerror = reject; img.src = base64Image;
        });
    }

    // JAVÍTOTT VIDEÓ BÉLYEGKÉP KÉSZÍTŐ (Megelőzi az Apple fagyását)
    function generateVideoThumbnail(file) {
        return new Promise((resolve) => {
            const video = document.createElement('video');
            video.preload = 'metadata';
            video.muted = true;
            video.playsInline = true;
            video.src = URL.createObjectURL(file);
            
            // Biztonsági időtúllépés (2.5 másodperc)
            const fallbackTimeout = setTimeout(() => {
                resolve("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"); // Átlátszó 1x1 GIF
            }, 2500);

            video.onloadedmetadata = () => {
                video.currentTime = Math.min(1, video.duration / 2 || 0.1);
            };
            
            video.onseeked = () => {
                clearTimeout(fallbackTimeout);
                try {
                    const canvas = document.createElement('canvas');
                    const scale = Math.min(300 / video.videoWidth, 1);
                    canvas.width = video.videoWidth * scale || 300;
                    canvas.height = video.videoHeight * scale || 300;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.5));
                } catch(e) {
                    resolve("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7");
                }
            };
            
            video.onerror = () => {
                clearTimeout(fallbackTimeout);
                resolve("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7");
            };

            video.load(); // Apple ébresztő
        });
    }

    function checkLockout() {
        let lockUntil = parseInt(localStorage.getItem('bf_lock') || '0');
        let now = Date.now();
        const btn = document.getElementById('login-btn');
        const msg = document.getElementById('lockout-msg');
        const input = document.getElementById('pin-input');

        if (now < lockUntil) {
            btn.disabled = true; input.disabled = true; msg.style.display = 'block';
            let remain = Math.ceil((lockUntil - now) / 60000);
            msg.innerText = `Túl sok hibás próbálkozás! Kizárva: ${remain} percig.`;
            if(!lockoutInterval) lockoutInterval = setInterval(checkLockout, 10000);
            return true;
        } else {
            btn.disabled = false; input.disabled = false; msg.style.display = 'none';
            if(lockoutInterval) { clearInterval(lockoutInterval); lockoutInterval = null; }
            return false;
        }
    }

    function handleFailedLogin() {
        let attempts = parseInt(localStorage.getItem('bf_attempts') || '0') + 1;
        localStorage.setItem('bf_attempts', attempts);
        if (attempts >= 5) {
            let minutes = 5 * Math.pow(2, attempts - 5); 
            localStorage.setItem('bf_lock', Date.now() + (minutes * 60000));
            checkLockout();
        } else {
            const msg = document.getElementById('status-msg');
            msg.innerText = `Hibás jelszó! (${5 - attempts} próbálkozás maradt)`;
            msg.style.color = "var(--danger)";
        }
    }

    function resetBruteForce() {
        localStorage.removeItem('bf_attempts'); localStorage.removeItem('bf_lock');
    }

    async function initAlbums() {
        let encAlbums = localStorage.getItem('gallery_albums_enc');
        if (encAlbums) {
            let dec = await decryptText(JSON.parse(encAlbums), sessionKeyMaterial);
            albums = dec ? JSON.parse(dec) : [];
        } else {
            let oldAlbums = localStorage.getItem('gallery_albums');
            if (oldAlbums) {
                albums = JSON.parse(oldAlbums); await saveAlbums(); localStorage.removeItem('gallery_albums'); 
            } else { albums = []; }
        }
        renderAlbumSelects();

        const lastSel = localStorage.getItem('last_album') || 'ALL';
        if (lastSel === 'ALL' || albums.includes(lastSel)) {
            document.getElementById('album-select').value = lastSel; document.getElementById('video-album-select').value = lastSel;
        } else {
            document.getElementById('album-select').value = 'ALL'; document.getElementById('video-album-select').value = 'ALL';
        }
        
        const currentSel = document.getElementById('album-select').value;
        document.getElementById('del-album-btn').style.display = (currentSel !== 'ALL') ? 'block' : 'none';
        document.getElementById('del-video-album-btn').style.display = (document.getElementById('video-album-select').value !== 'ALL') ? 'block' : 'none';
    }

    async function saveAlbums() {
        let enc = await encryptText(JSON.stringify(albums), sessionKeyMaterial);
        localStorage.setItem('gallery_albums_enc', JSON.stringify(enc));
    }

    function renderAlbumSelects() {
        const mainSelect = document.getElementById('album-select'); const moveSelect = document.getElementById('move-album-select');
        const videoSelect = document.getElementById('video-album-select'); const videoMoveSelect = document.getElementById('video-move-album-select');
        
        mainSelect.innerHTML = '<option value="ALL">Minden Kép</option>'; moveSelect.innerHTML = '<option value="ALL">Minden Kép (Kivétel a mappából)</option>';
        videoSelect.innerHTML = '<option value="ALL">Minden Videó</option>'; videoMoveSelect.innerHTML = '<option value="ALL">Minden Videó (Kivétel a mappából)</option>';

    async function handleMediaUpload(event) {
        const files = event.target.files;
        if (!files.length) return;
        
        document.getElementById('upload-status').innerText = `${files.length} fájl feldolgozása...`;
        
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            document.getElementById('upload-status').innerText = `Titkosítás: ${i + 1} / ${files.length}`;

            if (file.type.startsWith('video/')) {
                const currentAlbum = document.getElementById('video-album-select') ? document.getElementById('video-album-select').value : 'ALL';
                const thumbBase64 = await generateVideoThumbnail(file);
                
                const encThumb = await encryptData(new TextEncoder().encode(thumbBase64), sessionKeyMaterial);
                const encAlbum = currentAlbum !== 'ALL' ? await encryptText(currentAlbum, sessionKeyMaterial) : null;
                const encName = await encryptText(file.name, sessionKeyMaterial);
                const encType = await encryptText(file.type, sessionKeyMaterial);
                
                const videoId = "vid_" + Date.now() + "_" + Math.floor(Math.random()*10000);
                const chunkSize = 5 * 1024 * 1024; 
                const totalChunks = Math.ceil(file.size / chunkSize);

                for (let c = 0; c < totalChunks; c++) {
                    document.getElementById('upload-status').innerText = `Szeletelés: ${c + 1}/${totalChunks}...`;
                    await new Promise(r => setTimeout(r, 10)); // JAVÍTÁS: pici szünet, hogy frissüljön a képernyő

                    const chunkBuffer = await file.slice(c * chunkSize, (c + 1) * chunkSize).arrayBuffer();
                    const encChunk = await encryptData(chunkBuffer, sessionKeyMaterial); 
                    
                    await new Promise(resolve => {
                        const tx = db.transaction(['video_chunks'], 'readwrite');
                        tx.objectStore('video_chunks').add({ videoId: videoId, chunkIndex: c, data: encChunk });
                        tx.oncomplete = resolve;
                    });
                }
                
                await new Promise(resolve => {
                    const tx = db.transaction(['videos'], 'readwrite');
                    tx.objectStore('videos').add({ videoId: videoId, version: 3, thumb: encThumb, album: encAlbum, name: encName, mime: encType, chunks: totalChunks });
                    tx.oncomplete = resolve;
                });

            } 
            else {
                const currentAlbum = document.getElementById('album-select').value;
                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const originalBase64 = e.target.result;
                        const thumbBase64 = await generateThumbnail(originalBase64);
                        
                        const enc = new TextEncoder();
                        const encryptedFull = await encryptData(enc.encode(originalBase64), sessionKeyMaterial);
                        const encryptedThumb = await encryptData(enc.encode(thumbBase64), sessionKeyMaterial);
                        
                        const encAlbum = currentAlbum !== 'ALL' ? await encryptText(currentAlbum, sessionKeyMaterial) : null;
                        
                        const payload = { version: 2, full: encryptedFull, thumb: encryptedThumb, album: encAlbum };
                        const transaction = db.transaction(['images'], 'readwrite');
                        transaction.objectStore('images').add(payload);
                        transaction.oncomplete = resolve;
                    };
                    reader.readAsDataURL(file);
                });
            }
        }
        
        document.getElementById('upload-status').innerText = "Várakozás fájlra...";
        document.getElementById('media-input').value = '';
        alert("Feltöltés sikeres!");
        showView('menu-view');
    }

    function renderSingleThumbnail(id, container, currentAlbum) {
        return new Promise((resolve) => {
            db.transaction(['images'], 'readonly').objectStore('images').get(id).onsuccess = async (e) => {

                full: { salt: Array.from(newEncFull.salt), iv: Array.from(newEncFull.iv), data: await getBase64Safe(newEncFull.data), iter: newEncFull.iter },
                thumb: { salt: Array.from(newEncThumb.salt), iv: Array.from(newEncThumb.iv), data: await getBase64Safe(newEncThumb.data), iter: newEncThumb.iter }
            };
            blobParts.push(JSON.stringify(serRec) + (i < selected.length - 1 ? "," : ""));
            await new Promise(res => setTimeout(res, 20)); 
        }

        blobParts.push("]"); pendingExportFile = new File([new Blob(blobParts, { type: 'application/json' })], 'ssshh.json', { type: 'application/json' });
        exportBtn.disabled = false; exportBtn.innerText = "📦 Kész! Kattints a megosztáshoz"; exportBtn.style.background = "var(--success)"; exportBtn.onclick = executeShareSheet; 
    }

    function executeShareSheet() {
        if (!pendingExportFile) return;
        if (navigator.canShare && navigator.canShare({ files: [pendingExportFile] })) { navigator.share({ files: [pendingExportFile] }).then(resetExportUI).catch(resetExportUI); } 
        else { const url = URL.createObjectURL(pendingExportFile); const a = document.createElement('a'); a.href = url; a.download = 'ssshh.json'; a.click(); URL.revokeObjectURL(url); resetExportUI(); }
    }

    function resetExportUI() {
        pendingExportFile = null; document.querySelectorAll('#gallery-container input:checked').forEach(cb => cb.checked = false);
        const exportBtn = document.getElementById('export-btn'); exportBtn.style.background = "var(--warning)"; exportBtn.onclick = exportSelected; updateSelectionBtns();

    async function deleteSelected() {
        if (!confirm("Biztosan véglegesen törlöd a kijelölt képeket?")) return;
        const store = db.transaction(['images'], 'readwrite').objectStore('images');
        document.querySelectorAll('#gallery-container input:checked').forEach(cb => store.delete(Number(cb.value))); openGallery();

    async function loadFullscreenImage(index) {
        const imgEl = document.getElementById('fs-img'); const loader = document.getElementById('fs-loader');
        imgEl.src = ""; loader.style.display = "block";
        db.transaction(['images'], 'readonly').objectStore('images').get(currentGalleryIds[index]).onsuccess = async (e) => {
            const record = e.target.result;
            if(record) {
                const decBuf = await decryptData(record.version === 2 ? record.full : record, sessionKeyMaterial);
                if(decBuf) { imgEl.src = new TextDecoder().decode(decBuf); }
                loader.style.display = "none";
            }
        };
    }

    function openFullscreen(index) { currentImgIndex = index; document.getElementById('gallery-view').classList.remove('active'); document.getElementById('fullscreen-view').classList.add('active'); loadFullscreenImage(currentImgIndex); }
    function closeFullscreen() { document.getElementById('fullscreen-view').classList.remove('active'); document.getElementById('gallery-view').classList.add('active'); document.getElementById('fs-img').src = ""; }

    // --- LAPOZÁS A TELJES KÉPERNYŐS NÉZETBEN (balra/jobbra swipe) ---
    function showPrevImage() { if (currentImgIndex > 0) { currentImgIndex--; loadFullscreenImage(currentImgIndex); } }
    function showNextImage() { if (currentImgIndex < currentGalleryIds.length - 1) { currentImgIndex++; loadFullscreenImage(currentImgIndex); } }

    let fsTouchStartX = 0, fsTouchStartY = 0, fsTouchStartTime = 0, fsTouchIsMulti = false;

    document.getElementById('fullscreen-view').addEventListener('touchstart', (e) => {
        fsTouchIsMulti = e.touches.length > 1;
        if (fsTouchIsMulti) return;
        fsTouchStartX = e.touches[0].clientX; fsTouchStartY = e.touches[0].clientY; fsTouchStartTime = Date.now();
    }, { passive: true });

    document.getElementById('fullscreen-view').addEventListener('touchend', (e) => {
        if (fsTouchIsMulti || e.changedTouches.length !== 1) return;
        if (window.visualViewport && window.visualViewport.scale > 1.05) return; // nagyítva van, ne lapozzon, hagyja a pant

        const dx = e.changedTouches[0].clientX - fsTouchStartX;
        const dy = e.changedTouches[0].clientY - fsTouchStartY;
        const elapsed = Date.now() - fsTouchStartTime;

        if (elapsed < 600 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
            dx < 0 ? showNextImage() : showPrevImage();
        }
    }, { passive: true });


    // --- ÚJ: VIDEÓGALÉRIA MOTOR ---
    function openVideoGallery() {
        showView('video-gallery-view');
        const container = document.getElementById('video-gallery-container');
        container.innerHTML = '<p style="grid-column: span 2; text-align: center;">Videók betöltése...</p>';
        
        isAllVideoSelected = false; updateVideoSelectionBtns(); currentVideoGalleryIds = []; 
        const currentAlbum = document.getElementById('video-album-select').value;

        db.transaction(['videos'], 'readonly').objectStore('videos').getAllKeys().onsuccess = async (e) => {
            const keys = e.target.result;
            if (!keys || keys.length === 0) { container.innerHTML = '<p style="grid-column: span 2;">Üres a videógaléria.</p>'; return; }
            container.innerHTML = '';
            for (let id of keys) { await renderSingleVideoThumbnail(id, container, currentAlbum); await new Promise(res => setTimeout(res, 10)); }
            if(currentVideoGalleryIds.length === 0) { container.innerHTML = '<p style="grid-column: span 2;">Ebben a mappában nincsenek videók.</p>'; }
        };
    }

    function renderSingleVideoThumbnail(id, container, currentAlbum) {
        return new Promise((resolve) => {
            db.transaction(['videos'], 'readonly').objectStore('videos').get(id).onsuccess = async (e) => {
                const record = e.target.result;
                if (record) {
                    let recAlbum = 'ALL';
                    if (record.album) { recAlbum = typeof record.album === 'string' ? record.album : await decryptText(record.album, sessionKeyMaterial); }
                    if (currentAlbum !== 'ALL' && recAlbum !== currentAlbum) { resolve(); return; }
                    
                    const decBuf = await decryptData(record.thumb, sessionKeyMaterial);
                    if (decBuf) {
                        const decodedThumb = new TextDecoder().decode(decBuf);
                        if (!/^data:image\/[a-zA-Z+.-]+;base64,[A-Za-z0-9+/=]+$/.test(decodedThumb)) { resolve(); return; } // gyanús/érvénytelen bélyegkép (pl. importból) - kihagyjuk
                        currentVideoGalleryIds.push(id);
                        const card = document.createElement('div'); card.className = 'img-card';
                        const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.value = id; checkbox.onchange = updateVideoSelectionBtns;
                        const img = document.createElement('img'); img.src = decodedThumb; img.onclick = () => openVideoPlayer(id);
                        const playIcon = document.createElement('div'); playIcon.className = 'play-icon'; playIcon.textContent = '▶';
                        card.appendChild(checkbox); card.appendChild(img); card.appendChild(playIcon);
                        container.appendChild(card);
                    }
                } resolve();
            };
        });
    }

    function toggleVideoSelectAll() {
        isAllVideoSelected = !isAllVideoSelected; document.querySelectorAll('#video-gallery-container input[type="checkbox"]').forEach(cb => cb.checked = isAllVideoSelected); updateVideoSelectionBtns();
    }

    function updateVideoSelectionBtns() {
        const selected = document.querySelectorAll('#video-gallery-container input:checked'); const allBoxes = document.querySelectorAll('#video-gallery-container input[type="checkbox"]');
        document.getElementById('video-select-all-btn').innerText = (selected.length === allBoxes.length && allBoxes.length > 0) ? "Kijelölés törlése" : "Mindet kijelöl";

            document.getElementById('video-move-btn').innerText = `Mozgatás (${selected.length})`; document.getElementById('video-save-original-btn').innerText = `Kimentés (${selected.length})`;
        }
    }

    function showVideoMoveModal() { renderAlbumSelects(); showView('video-move-view'); }

    async function executeVideoMove() {
        const targetAlbum = document.getElementById('video-move-album-select').value;
        const encAlbumData = targetAlbum !== 'ALL' ? await encryptText(targetAlbum, sessionKeyMaterial) : null;
        let movedCount = 0;
        
        for (let cb of document.querySelectorAll('#video-gallery-container input:checked')) {
            await new Promise((resolve) => {
                const store = db.transaction(['videos'], 'readwrite').objectStore('videos');
                store.get(Number(cb.value)).onsuccess = e => { const rec = e.target.result; if(rec) { rec.album = encAlbumData; store.put(rec, Number(cb.value)).onsuccess = resolve; } else { resolve(); } };
            }); movedCount++;
        }
        alert(`${movedCount} videó áthelyezve ide: ${targetAlbum === 'ALL' ? 'Minden Videó' : targetAlbum}`); showView('video-gallery-view'); openVideoGallery(); 
    }

    async function deleteSelectedVideos() {
        if (!confirm("Biztosan véglegesen törlöd a kijelölt videókat?")) return;
        for(let cb of document.querySelectorAll('#video-gallery-container input:checked')) {
            const id = Number(cb.value);
            await new Promise(r => { db.transaction(['videos'], 'readwrite').objectStore('videos').delete(id).onsuccess = r; });

    let pendingOriginalVideos = [];
    async function saveOriginalVideos() {
        const selected = document.querySelectorAll('#video-gallery-container input:checked'); if (selected.length === 0) return;
        if (!confirm("⚠️ FIGYELEM!\nEzzel a funkcióval a videókat NYÍLT formátumban mented ki!\nBiztosan folytatod?")) return;
        const verifyPin = prompt("Biztosíték: MESTERJELSZÓ:"); if (!verifyPin) return;
        if (await decryptText(JSON.parse(localStorage.getItem('appSetup')), await getMasterKeyMaterial(verifyPin)) !== "OK") { alert("Hibás jelszó!"); return; }

        const saveBtn = document.getElementById('video-save-original-btn'); saveBtn.innerText = "Dekódolás (0%)..."; saveBtn.disabled = true; pendingOriginalVideos = [];

        for (let i = 0; i < selected.length; i++) {
            saveBtn.innerText = `Dekódolás (${Math.round(((i + 1) / selected.length) * 100)}%)...`;
            const rec = await new Promise(r => { db.transaction(['videos'],'readonly').objectStore('videos').get(Number(selected[i].value)).onsuccess = e => r(e.target.result); });
            if(!rec) continue;
            
            const name = await decryptText(rec.name, sessionKeyMaterial) || `video_${Date.now()}_${i}.mp4`;
            const mime = await decryptText(rec.mime, sessionKeyMaterial) || 'video/mp4';
            
            const chunks = await new Promise(r => {
                const result = []; db.transaction(['video_chunks'], 'readonly').objectStore('video_chunks').index('videoId').openCursor(IDBKeyRange.only(rec.videoId)).onsuccess = e => {
                    const c = e.target.result; if(c) { result.push(c.value); c.continue(); } else r(result);
                }
            });
            chunks.sort((a,b) => a.chunkIndex - b.chunkIndex);
            let decryptedChunks = [];
            for(let chunk of chunks) {
                const decBuf = await decryptData(chunk.data, sessionKeyMaterial);
                if(decBuf) decryptedChunks.push(decBuf);
            }
            pendingOriginalVideos.push(new File([new Blob(decryptedChunks, { type: mime })], name, { type: mime }));
        }

        saveBtn.disabled = false; saveBtn.innerText = "✅ Kattints a mentéshez!"; saveBtn.style.background = "var(--success)"; saveBtn.onclick = executeShareOriginalVideos;
    }

    function executeShareOriginalVideos() {
        if (pendingOriginalVideos.length === 0) return;
        if (navigator.canShare && navigator.canShare({ files: pendingOriginalVideos })) { navigator.share({ files: pendingOriginalVideos }).then(resetSaveOrigVideoUI).catch(resetSaveOrigVideoUI); } 
        else { pendingOriginalVideos.forEach(f => { const url = URL.createObjectURL(f); const a = document.createElement('a'); a.href = url; a.download = f.name; a.click(); URL.revokeObjectURL(url); }); resetSaveOrigVideoUI(); }
    }

    function resetSaveOrigVideoUI() {
        pendingOriginalVideos = []; document.querySelectorAll(`#video-gallery-container input:checked`).forEach(cb => cb.checked = false);
        const btn = document.getElementById('video-save-original-btn'); btn.style.background = "var(--info)"; btn.onclick = saveOriginalVideos; updateVideoSelectionBtns();
    }

    let pendingVideoExportFile = null;
    async function exportSelectedVideos() {
        const selected = document.querySelectorAll('#video-gallery-container input:checked'); if (selected.length === 0) return;
        const expPw = prompt("🔒 KÜLDÉSI JELSZÓ LÉTREHOZÁSA:\n\nAdj meg egy tetszőleges jelszót a videók exportálásához."); if (!expPw) return;

        const exportBtn = document.getElementById('video-export-btn'); exportBtn.innerText = "Csomagolás (0%)..."; exportBtn.disabled = true; 
        const exportKeyMaterial = await getMasterKeyMaterial(expPw); let blobParts = ["["];

        for (let i = 0; i < selected.length; i++) {
            exportBtn.innerText = `Csomagolás (${Math.round(((i + 1) / selected.length) * 100)}%)...`;
            const rec = await new Promise((resolve) => { db.transaction(['videos'], 'readonly').objectStore('videos').get(Number(selected[i].value)).onsuccess = (e) => resolve(e.target.result); });
            if (!rec) continue;

            let album = rec.album ? await encryptText(await decryptText(rec.album, sessionKeyMaterial), exportKeyMaterial) : null;
            let name = await encryptText(await decryptText(rec.name, sessionKeyMaterial), exportKeyMaterial);
            let mime = await encryptText(await decryptText(rec.mime, sessionKeyMaterial), exportKeyMaterial);
            const newThumb = await encryptData(await decryptData(rec.thumb, sessionKeyMaterial), exportKeyMaterial);
            
            const chunks = await new Promise(r => {
                const result = []; db.transaction(['video_chunks'], 'readonly').objectStore('video_chunks').index('videoId').openCursor(IDBKeyRange.only(rec.videoId)).onsuccess = e => {
                    const c = e.target.result; if(c) { result.push(c.value); c.continue(); } else r(result);
                }
            });
            
            let reEncChunks = [];
            for(let chunk of chunks) {
                const newChunkData = await encryptData(await decryptData(chunk.data, sessionKeyMaterial), exportKeyMaterial);
                reEncChunks.push({ index: chunk.chunkIndex, salt: Array.from(newChunkData.salt), iv: Array.from(newChunkData.iv), data: await getBase64Safe(newChunkData.data), iter: newChunkData.iter });
            }

            let serRec = { type: 'video', version: 3, album: album, name: name, mime: mime, chunksCount: rec.chunks, thumb: { salt: Array.from(newThumb.salt), iv: Array.from(newThumb.iv), data: await getBase64Safe(newThumb.data), iter: newThumb.iter }, chunksData: reEncChunks };
            blobParts.push(JSON.stringify(serRec) + (i < selected.length - 1 ? "," : ""));
            await new Promise(res => setTimeout(res, 20)); 
        }

        blobParts.push("]"); pendingVideoExportFile = new File([new Blob(blobParts, { type: 'application/json' })], 'ssshh_videos.json', { type: 'application/json' });
        exportBtn.disabled = false; exportBtn.innerText = "📦 Kész! Kattints a megosztáshoz"; exportBtn.style.background = "var(--success)"; exportBtn.onclick = executeVideoShareSheet; 
    }

    function executeVideoShareSheet() {
        if (!pendingVideoExportFile) return;
        if (navigator.canShare && navigator.canShare({ files: [pendingVideoExportFile] })) { navigator.share({ files: [pendingVideoExportFile] }).then(resetVideoExportUI).catch(resetVideoExportUI); } 
        else { const url = URL.createObjectURL(pendingVideoExportFile); const a = document.createElement('a'); a.href = url; a.download = 'ssshh_videos.json'; a.click(); URL.revokeObjectURL(url); resetVideoExportUI(); }
    }

    function resetVideoExportUI() {
        pendingVideoExportFile = null; document.querySelectorAll('#video-gallery-container input:checked').forEach(cb => cb.checked = false);
        const exportBtn = document.getElementById('video-export-btn'); exportBtn.style.background = "var(--warning)"; exportBtn.onclick = exportSelectedVideos; updateVideoSelectionBtns();
    }

    // --- VIDEÓ LEJÁTSZÓ MOTOR ---
    async function openVideoPlayer(videoId) {
        document.getElementById('video-gallery-view').classList.remove('active');
        const playerView = document.getElementById('video-player-view'); playerView.style.display = 'flex';
        
        const loader = document.getElementById('video-loader'); const progressEl = document.getElementById('video-progress'); const videoEl = document.getElementById('fs-video');
        loader.style.display = "block"; videoEl.style.display = "none"; videoEl.src = ""; progressEl.innerText = "0%";

        const videoMeta = await new Promise(r => { db.transaction(['videos'], 'readonly').objectStore('videos').get(videoId).onsuccess = e => r(e.target.result); });
        if(!videoMeta) { loader.innerText = "Hiba: Videó nem található!"; return; }

        const mime = await decryptText(videoMeta.mime, sessionKeyMaterial) || 'video/mp4';
        let decryptedChunks = [];
        
        const chunks = await new Promise(r => {
            const result = []; db.transaction(['video_chunks'], 'readonly').objectStore('video_chunks').index('videoId').openCursor(IDBKeyRange.only(videoMeta.videoId)).onsuccess = e => {
                const cursor = e.target.result; if(cursor) { result.push(cursor.value); cursor.continue(); } else r(result);
            }
        });
        chunks.sort((a,b) => a.chunkIndex - b.chunkIndex);

        for(let i = 0; i < chunks.length; i++) {
            progressEl.innerText = `${Math.round(((i + 1) / chunks.length) * 100)}%`;
            const decBuf = await decryptData(chunks[i].data, sessionKeyMaterial);
            if(decBuf) decryptedChunks.push(decBuf);
            if (i % 5 === 0) await new Promise(res => setTimeout(res, 5)); 
        }

        const videoBlob = new Blob(decryptedChunks, { type: mime }); decryptedChunks = []; 
        activeVideoUrl = URL.createObjectURL(videoBlob);
        
        loader.style.display = "none"; videoEl.style.display = "block"; videoEl.src = activeVideoUrl; videoEl.play().catch(()=>{}); 
    }

    function closeVideoPlayer() {
        if(activeVideoUrl) { URL.revokeObjectURL(activeVideoUrl); activeVideoUrl = null; }
        const videoEl = document.getElementById('fs-video'); videoEl.pause(); videoEl.src = ""; videoEl.load();
        document.getElementById('video-player-view').style.display = 'none'; document.getElementById('video-gallery-view').classList.add('active');
    }

    // --- IMPORTÁLÓ MOTOR (Javított) ---
    let pendingImportData = null;
    function loadImportFile(event) {
        const file = event.target.files[0]; if (!file) return; document.getElementById('import-filename').innerText = file.name;
        const reader = new FileReader(); reader.onload = (e) => { try { pendingImportData = JSON.parse(e.target.result); } catch (err) { alert("Érvénytelen fájlformátum!"); pendingImportData = null; } }; reader.readAsText(file);
    }

    async function processImport() {
        if (!pendingImportData) { alert("Előbb válassz ki egy fájlt!"); return; }
        const senderPin = document.getElementById('import-pin').value; if (!senderPin) { alert("Írd be a KÜLDÉSI jelszót!"); return; }

        const statusEl = document.getElementById('import-status'); statusEl.innerText = "Feldolgozás és Átkódolás...";
        const senderMaterial = await getMasterKeyMaterial(senderPin); let successCount = 0; let failCount = 0;

        for (let record of pendingImportData) {
            try {
                if (record.type === 'note') {
                    const plainTitle = await decryptText(record.title, senderMaterial);
                    const plainContent = await decryptText(record.content, senderMaterial);
                    if (plainTitle !== null && plainContent !== null) {
                        const myEncTitle = await encryptText(plainTitle, sessionKeyMaterial);
                        const myEncContent = await encryptText(plainContent, sessionKeyMaterial);
                        await new Promise(resolve => {
                            const transaction = db.transaction(['notes'], 'readwrite');
                            transaction.objectStore('notes').add({ title: myEncTitle, content: myEncContent, timestamp: record.timestamp || Date.now() });
                            transaction.oncomplete = resolve;
                        });
                        successCount++;
                    } else { failCount++; }
                } 
                else if (record.type === 'video') {
                    const album = record.album ? await decryptText(record.album, senderMaterial) : null;
                    const name = await decryptText(record.name, senderMaterial); 
                    const mime = await decryptText(record.mime, senderMaterial);
                    
                    let thumbDec = { salt: new Uint8Array(record.thumb.salt), iv: new Uint8Array(record.thumb.iv), data: await base64ToBufferAsync(record.thumb.data), iter: record.thumb.iter };
                    const decThumbBuf = await decryptData(thumbDec, senderMaterial);
                    
                    if(decThumbBuf && name) {
                        const videoId = "vid_" + Date.now() + "_" + Math.floor(Math.random()*10000);
                        if (album && !albums.includes(album)) { albums.push(album); await saveAlbums(); }
                        
                        for(let chunk of record.chunksData) {
                            let chunkDec = { salt: new Uint8Array(chunk.salt), iv: new Uint8Array(chunk.iv), data: await base64ToBufferAsync(chunk.data), iter: chunk.iter };
                            const decChunkBuf = await decryptData(chunkDec, senderMaterial);
                            
                            // Itt nincs egy sorba írva az await, szépen megvárja a titkosítást
                            const reEncryptedChunk = await encryptData(decChunkBuf, sessionKeyMaterial);
                            await new Promise(r => { 
                                db.transaction(['video_chunks'], 'readwrite').objectStore('video_chunks').add({ videoId: videoId, chunkIndex: chunk.index, data: reEncryptedChunk }).onsuccess = r; 
                            });
                        }
                        
                        const reEncryptedThumb = await encryptData(decThumbBuf, sessionKeyMaterial);
                        const reEncryptedAlbum = album ? await encryptText(album, sessionKeyMaterial) : null;
                        const reEncryptedName = await encryptText(name, sessionKeyMaterial);
                        const reEncryptedMime = await encryptText(mime, sessionKeyMaterial);

                        await new Promise(r => { 
                            db.transaction(['videos'], 'readwrite').objectStore('videos').add({ videoId: videoId, version: 3, thumb: reEncryptedThumb, album: reEncryptedAlbum, name: reEncryptedName, mime: reEncryptedMime, chunks: record.chunksCount }).onsuccess = r; 
                        });
                        successCount++;
                    } else failCount++;
                }
                else {
                    let exportedFull = record.version === 2 ? record.full : record; let exportedThumb = record.version === 2 ? record.thumb : record;
                    let dataToDecryptFull = { salt: new Uint8Array(exportedFull.salt), iv: new Uint8Array(exportedFull.iv), data: typeof exportedFull.data === 'string' ? await base64ToBufferAsync(exportedFull.data) : new Uint8Array(exportedFull.data), iter: exportedFull.iter };
                    let dataToDecryptThumb = { salt: new Uint8Array(exportedThumb.salt), iv: new Uint8Array(exportedThumb.iv), data: typeof exportedThumb.data === 'string' ? await base64ToBufferAsync(exportedThumb.data) : new Uint8Array(exportedThumb.data), iter: exportedThumb.iter };

                    const decFullBuf = await decryptData(dataToDecryptFull, senderMaterial);
                    const decThumbBuf = await decryptData(dataToDecryptThumb, senderMaterial);

                    if (decFullBuf && decThumbBuf) {
                        let plainAlbumName = record.album ? await decryptText(record.album, senderMaterial) : null;
                        
                        const encryptedFull = await encryptData(decFullBuf, sessionKeyMaterial);
                        const encryptedThumb = await encryptData(decThumbBuf, sessionKeyMaterial);
                        const myAlbumData = plainAlbumName ? await encryptText(plainAlbumName, sessionKeyMaterial) : null;

                        if (plainAlbumName && !albums.includes(plainAlbumName)) { albums.push(plainAlbumName); await saveAlbums(); }

                        await new Promise(resolve => {
                            const transaction = db.transaction(['images'], 'readwrite');
                            transaction.objectStore('images').add({ version: 2, full: encryptedFull, thumb: encryptedThumb, album: myAlbumData });
                            transaction.oncomplete = resolve;
                        });
                        successCount++;
                    } else { failCount++; }
                }
            } catch(e) { failCount++; }
        }

        statusEl.innerText = ""; document.getElementById('import-pin').value = ''; document.getElementById('import-file-input').value = ''; document.getElementById('import-filename').innerText = ''; pendingImportData = null;
        alert(`Importálás befejezve!\nSikeres: ${successCount}\nHibás jelszó: ${failCount}`); renderAlbumSelects(); showView('menu-view');
    }
