<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Titkos Galéria</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Galéria">
    <link rel="apple-touch-icon" href="./appstore.png">
    
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --primary: #0a84ff; --danger: #ff453a; --success: #32d74b; --warning: #ff9f0a; --info: #30d158; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; text-align: center; }
        
        button, input, select, textarea { touch-action: manipulation; }

        .view { display: none; max-width: 500px; margin: 0 auto; padding-top: 20px; position: relative; }
        .active { display: block; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 15px; font-size: 20px; text-align: center; border-radius: 10px; border: none; box-sizing: border-box; margin-bottom: 15px; background: #333; color: white; }
        textarea { width: 100%; height: 250px; padding: 15px; font-size: 16px; border-radius: 10px; border: none; box-sizing: border-box; margin-bottom: 15px; background: #333; color: white; font-family: inherit; resize: vertical; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: bold; margin-bottom: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary { background: #333; }
        button.danger { background: var(--danger); }
        button.warning { background: var(--warning); }
        button.info { background: var(--info); }
        select { width: 100%; padding: 15px; border-radius: 10px; font-size: 16px; background: #333; color: white; border: none; margin-bottom: 15px; box-sizing: border-box; }
        
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; margin-bottom: 15px; }
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }
        .file-upload-btn { background: var(--primary); color: white; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; display: block; width: 100%; box-sizing: border-box; }
        
        .gallery-header { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
        .gallery-header select { margin-bottom: 0; flex: 1; }
        .gallery-header button { width: auto; margin-bottom: 0; padding: 12px 15px; }

        .gallery-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 150px; }
        .img-card { position: relative; width: 100%; height: 150px; border-radius: 10px; overflow: hidden; border: 1px solid #333; background: #222; }
        .img-card img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        .img-card input[type="checkbox"] { position: absolute; top: 10px; right: 10px; width: 25px; height: 25px; z-index: 10; accent-color: var(--primary); }
        .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; color: rgba(255,255,255,0.8); pointer-events: none; text-shadow: 0 0 10px black; }
        
        .gallery-actions { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: #1e1e1e; 
            padding: 10px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 5px; 
            justify-content: center; z-index: 100; border-top: 1px solid #333;
            padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 10px);
        }
        .gallery-actions button { flex: 1 1 calc(33% - 10px); font-size: 12px; padding: 10px 5px; margin: 0; }
        
        #status-msg { font-size: 14px; margin-top: 10px; min-height: 20px; }
        #lockout-msg { color: var(--danger); font-size: 16px; font-weight: bold; margin-bottom: 15px; display: none; }

        /* LÁTHATATLAN TITKOS PONT */
        #secret-dot { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background-color: transparent; border-radius: 50%; z-index: 1000; }

        #notes-list { margin-bottom: 150px; }
        .note-item { background: #222; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #333; display: flex; align-items: center; }
        .note-item span { font-weight: bold; cursor: pointer; flex-grow: 1; text-align: left; }
        
        .fullscreen-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000000; z-index: 200; display: none; 
            align-items: center; justify-content: center; overflow: hidden; flex-direction: column;
        }
        .fullscreen-overlay.active { display: flex; }
        .fs-content { max-width: 100%; max-height: 100%; object-fit: contain; z-index: 201; }
        .fs-close { 
            position: absolute; top: calc(env(safe-area-inset-top, 20px) + 10px); right: 20px; 
            background: rgba(255,255,255,0.2); border: none; color: white; font-size: 18px; 
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 203; 
            display: flex; align-items: center; justify-content: center; padding: 0;
        }
        .fs-loader { position: absolute; color: white; font-size: 16px; z-index: 202; display: none; text-align: center;}
    </style>
</head>
<body>

    <div id="login-view" class="view active">
        <h1>🔒 Titkos Galéria</h1>
        <p id="lockout-msg"></p>
        <p id="login-text">Add meg a jelszavad</p>
        <input type="password" id="pin-input" placeholder="Jelszó...">
        <button id="login-btn" onclick="login()">Belépés</button>
        <div id="status-msg"></div>
    </div>

    <div id="menu-view" class="view">
        <div id="secret-dot" onclick="handleSecretTap()"></div>
        <h1>Főmenü</h1>
        <button onclick="showView('upload-view')">📸 Új fájl hozzáadása</button>
        <button onclick="showView('import-view')">📥 Mentés Importálása</button>
        <button onclick="openGallery()">🖼️ Képek megtekintése</button>
        <button onclick="openVideoGallery()">🎬 Videók megtekintése</button>
        <button class="danger" onclick="logout()">Kijelentkezés</button>
    </div>

    <div id="notes-view" class="view">
        <h1>Titkos Jegyzetek</h1>
        <button onclick="editNote(null)" style="margin-bottom: 15px;">+ Új Jegyzet írása</button>
        <div id="notes-list"></div>
        <div class="gallery-actions">
            <button class="secondary" onclick="showView('menu-view')">Vissza</button>
            <button class="secondary" id="note-select-all-btn" onclick="toggleNoteSelectAll()">Mindet kijelöl</button>
            <button class="info" id="note-save-original-btn" style="display:none;" onclick="saveOriginalNotes()">Kimentés</button>
            <button class="warning" id="note-export-btn" style="display:none;" onclick="exportSelectedNotes()">Küldés</button>
            <button class="danger" id="note-delete-btn" style="display:none;" onclick="deleteSelectedNotes()">Törlés</button>
        </div>
    </div>

    <div id="note-editor-view" class="view">
        <input type="text" id="note-title" placeholder="Jegyzet címe...">
        <textarea id="note-content" placeholder="Ide írd a titkos szöveget..."></textarea>
        <button onclick="saveNote()">Mentés</button>
        <button class="secondary" onclick="openNotes()">Mégsem</button>
    </div>

    <div id="move-view" class="view">
        <h1>Áthelyezés mappába</h1>
        <select id="move-album-select"></select>
        <button onclick="executeMove()">Áthelyezés</button>
        <button class="secondary" onclick="cancelMove()">Mégsem</button>
    </div>

    <div id="import-view" class="view">
        <h1>📥 Importálás</h1>
        <div class="file-upload-wrapper">
            <button class="file-upload-btn">Titkosított fájl kiválasztása</button>
            <input type="file" accept=".json,application/json" id="import-file-input" onchange="loadImportFile(event)">
        </div>
        <p id="import-filename" style="font-size: 14px; color: var(--primary); margin-bottom: 15px;"></p>
        <input type="password" id="import-pin" placeholder="Küldési jelszó...">
        <button class="warning" onclick="processImport()">Importálás és Feloldás</button>
        <p id="import-status" style="font-size: 14px; color: var(--primary);"></p>
        <button class="secondary" onclick="showView('menu-view')">Vissza a menübe</button>
    </div>

    <div id="upload-view" class="view">
        <h1>Fájl titkosítása</h1>
        <div class="file-upload-wrapper">
            <button class="file-upload-btn">Kép vagy Videó kiválasztása</button>
            <input type="file" accept="image/*, video/*" id="media-input" multiple onchange="handleMediaUpload(event)">
        </div>
        <p id="upload-status" style="font-size: 14px; color: gray;">Várakozás fájlra...</p>
        <button class="secondary" onclick="showView('menu-view')">Vissza a menübe</button>
    </div>

    <div id="gallery-view" class="view">
        <div class="gallery-header">
            <select id="album-select" onchange="changeAlbum('image')"><option value="ALL">Minden Kép</option></select>
            <button onclick="createAlbum('image')">+ Új</button>
            <button id="del-album-btn" class="danger" onclick="deleteAlbum('image')" style="display:none;">Törlés</button>
        </div>
        <div id="gallery-container" class="gallery-container"></div>
        <div class="gallery-actions">
            <button class="secondary" onclick="showView('menu-view')">Vissza</button>
            <button class="secondary" id="select-all-btn" onclick="toggleSelectAll('image')">Mindet kijelöl</button>
            <button class="primary" id="move-btn" style="display:none;" onclick="showMoveModal('image')">Mozgatás</button>
            <button class="info" id="save-original-btn" style="display:none;" onclick="saveOriginals('image')">Kimentés</button>
            <button class="warning" id="export-btn" style="display:none;" onclick="exportSelected('image')">Küldés</button>
            <button class="danger" id="delete-btn" style="display:none;" onclick="deleteSelected('image')">Törlés</button>
        </div>
    </div>

    <div id="video-gallery-view" class="view">
        <div class="gallery-header">
            <select id="video-album-select" onchange="changeAlbum('video')"><option value="ALL">Minden Videó</option></select>
            <button onclick="createAlbum('video')">+ Új</button>
            <button id="del-video-album-btn" class="danger" onclick="deleteAlbum('video')" style="display:none;">Törlés</button>
        </div>
        <div id="video-gallery-container" class="gallery-container"></div>
        <div class="gallery-actions">
            <button class="secondary" onclick="showView('menu-view')">Vissza</button>
            <button class="secondary" id="video-select-all-btn" onclick="toggleSelectAll('video')">Mindet kijelöl</button>
            <button class="primary" id="video-move-btn" style="display:none;" onclick="showMoveModal('video')">Mozgatás</button>
            <button class="info" id="video-save-original-btn" style="display:none;" onclick="saveOriginals('video')">Kimentés</button>
            <button class="warning" id="video-export-btn" style="display:none;" onclick="exportSelected('video')">Küldés</button>
            <button class="danger" id="video-delete-btn" style="display:none;" onclick="deleteSelected('video')">Törlés</button>
        </div>
    </div>

    <div id="fullscreen-view" class="fullscreen-overlay">
        <button class="fs-close" onclick="closeFullscreen()">✕</button>
        <div id="fs-loader" class="fs-loader">Betöltés...</div>
        <img id="fs-img" class="fs-content" src="">
    </div>

    <div id="video-player-view" class="fullscreen-overlay">
        <button class="fs-close" onclick="closeVideoPlayer()">✕</button>
        <div id="video-loader" class="fs-loader">Betöltés...<br><span id="video-progress">0%</span></div>
        <video id="fs-video" class="fs-content" controls playsinline style="display: none;"></video>
    </div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                reg.onupdatefound = () => {
                    const installingWorker = reg.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    };
                };
            });
        });
    }

    let sessionKeyMaterial = null; 
    let db;
    let currentGalleryIds = []; 
    let currentImgIndex = 0;       
    let isAllSelected = false;
    let isAllVideoSelected = false;
    let albums = [];
    let lockoutInterval = null;
    let activeMoveType = 'image';
    let activeVideoUrl = null;

    // ADATBÁZIS V3: Videók és Videó Szeletek hozzáadása!
    const request = indexedDB.open("SecureGalleryDB", 3);
    request.onupgradeneeded = (e) => {
        let db = e.target.result;
        if (!db.objectStoreNames.contains('images')) db.createObjectStore('images', { autoIncrement: true });
        if (!db.objectStoreNames.contains('notes')) db.createObjectStore('notes', { autoIncrement: true });
        if (!db.objectStoreNames.contains('videos')) db.createObjectStore('videos', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('video_chunks')) {
            let chunkStore = db.createObjectStore('video_chunks', { autoIncrement: true });
            chunkStore.createIndex('videoId', 'videoId', { unique: false });
        }
    };
    request.onsuccess = (e) => { db = e.target.result; };

    function bufferToBase64(buf) {
        return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.readAsDataURL(new Blob([buf]));
        });
    }

    async function base64ToBufferAsync(b64) {
        try {
            const res = await fetch('data:application/octet-stream;base64,' + b64);
            const buf = await res.arrayBuffer();
            return new Uint8Array(buf);
        } catch(e) {
            const binstr = atob(b64);
            const buf = new Uint8Array(binstr.length);
            for (let i = 0; i < binstr.length; i++) { buf[i] = binstr.charCodeAt(i); }
            return buf;
        }
    }

    async function getBase64Safe(data) {
        let safeData = data;
        if (Array.isArray(data)) { safeData = new Uint8Array(data); }
        return await bufferToBase64(safeData);
    }

    function dataURLtoFile(dataurl, filename) {
        var arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
            bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
        while(n--){ u8arr[n] = bstr.charCodeAt(n); }
        return new File([u8arr], filename, {type:mime});
    }

    async function getMasterKeyMaterial(password) {
        const enc = new TextEncoder();
        return await crypto.subtle.importKey("raw", enc.encode(password), {name: "PBKDF2"}, false, ["deriveBits", "deriveKey"]);
    }

    async function deriveAESKey(keyMaterial, salt) {
        return await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
            keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
        );
    }

    // A SZELETELT IV RENDSZER (Minden darab egyedi biztonságot kap)
    async function encryptData(dataBuffer, keyMaterial) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveAESKey(keyMaterial, salt);
        const encrypted = await crypto.subtle.encrypt({name: "AES-GCM", iv: iv}, key, dataBuffer);
        return { salt: salt, iv: iv, data: new Uint8Array(encrypted) }; 
    }

    async function decryptData(encryptedObj, keyMaterial) {
        try {
            const salt = new Uint8Array(encryptedObj.salt);
            const iv = new Uint8Array(encryptedObj.iv);
            const data = new Uint8Array(encryptedObj.data);
            const key = await deriveAESKey(keyMaterial, salt);
            const decrypted = await crypto.subtle.decrypt({name: "AES-GCM", iv: iv}, key, data);
            return new Uint8Array(decrypted); 
        } catch (e) { return null; }
    }

    async function encryptText(text, keyMaterial) {
        const enc = new TextEncoder();
        const encData = await encryptData(enc.encode(text), keyMaterial);
        return { salt: Array.from(encData.salt), iv: Array.from(encData.iv), data: await bufferToBase64(encData.data) };
    }

    async function decryptText(encryptedObj, keyMaterial) {
        try {
            const encData = {
                salt: new Uint8Array(encryptedObj.salt),
                iv: new Uint8Array(encryptedObj.iv),
                data: typeof encryptedObj.data === 'string' ? await base64ToBufferAsync(encryptedObj.data) : new Uint8Array(encryptedObj.data)
            };
            const decBuf = await decryptData(encData, keyMaterial);
            if (!decBuf) return null;
            return new TextDecoder().decode(decBuf);
        } catch(e) { return null; }
    }

    function generateThumbnail(base64Image, maxWidth = 300) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const scale = Math.min(maxWidth / img.width, 1);
                canvas.width = img.width * scale; canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.5)); 
            };
            img.onerror = reject; img.src = base64Image;
        });
    }

    // Videó bélyegkép lopó (Háttérben)
    function generateVideoThumbnail(file) {
        return new Promise((resolve) => {
            const video = document.createElement('video');
            video.src = URL.createObjectURL(file);
            video.muted = true; video.playsInline = true; video.currentTime = 1;
            video.onloadeddata = () => { video.currentTime = Math.min(1, video.duration / 2); };
            video.onseeked = () => {
                const canvas = document.createElement('canvas');
                const scale = Math.min(300 / video.videoWidth, 1);
                canvas.width = video.videoWidth * scale; canvas.height = video.videoHeight * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.5));
                URL.revokeObjectURL(video.src);
            };
            video.onerror = () => resolve(null);
        });
    }

    function checkLockout() {
        let lockUntil = parseInt(localStorage.getItem('bf_lock') || '0');
        let now = Date.now();
        const btn = document.getElementById('login-btn');
        const msg = document.getElementById('lockout-msg');
        const input = document.getElementById('pin-input');

        if (now < lockUntil) {
            btn.disabled = true; input.disabled = true; msg.style.display = 'block';
            let remain = Math.ceil((lockUntil - now) / 60000);
            msg.innerText = `Túl sok hibás próbálkozás! Kizárva: ${remain} percig.`;
            if(!lockoutInterval) lockoutInterval = setInterval(checkLockout, 10000);
            return true;
        } else {
            btn.disabled = false; input.disabled = false; msg.style.display = 'none';
            if(lockoutInterval) { clearInterval(lockoutInterval); lockoutInterval = null; }
            return false;
        }
    }

    function handleFailedLogin() {
        let attempts = parseInt(localStorage.getItem('bf_attempts') || '0') + 1;
        localStorage.setItem('bf_attempts', attempts);
        if (attempts >= 5) {
            let minutes = 5 * Math.pow(2, attempts - 5); 
            localStorage.setItem('bf_lock', Date.now() + (minutes * 60000));
            checkLockout();
        } else {
            const msg = document.getElementById('status-msg');
            msg.innerText = `Hibás jelszó! (${5 - attempts} próbálkozás maradt)`;
            msg.style.color = "var(--danger)";
        }
    }

    function resetBruteForce() { localStorage.removeItem('bf_attempts'); localStorage.removeItem('bf_lock'); }

    async function initAlbums() {
        let encAlbums = localStorage.getItem('gallery_albums_enc');
        if (encAlbums) {
            let dec = await decryptText(JSON.parse(encAlbums), sessionKeyMaterial);
            albums = dec ? JSON.parse(dec) : [];
        } else { albums = []; }
        renderAlbumSelects();

        const lastImgSel = localStorage.getItem('last_album_image') || 'ALL';
        const lastVidSel = localStorage.getItem('last_album_video') || 'ALL';
        
        document.getElementById('album-select').value = albums.includes(lastImgSel) ? lastImgSel : 'ALL';
        document.getElementById('video-album-select').value = albums.includes(lastVidSel) ? lastVidSel : 'ALL';
        
        document.getElementById('del-album-btn').style.display = (document.getElementById('album-select').value !== 'ALL') ? 'block' : 'none';
        document.getElementById('del-video-album-btn').style.display = (document.getElementById('video-album-select').value !== 'ALL') ? 'block' : 'none';
    }

    async function saveAlbums() {
        let enc = await encryptText(JSON.stringify(albums), sessionKeyMaterial);
        localStorage.setItem('gallery_albums_enc', JSON.stringify(enc));
    }

    function renderAlbumSelects() {
        const selects = ['album-select', 'video-album-select'];
        selects.forEach(id => { document.getElementById(id).innerHTML = '<option value="ALL">Minden</option>'; });
        document.getElementById('move-album-select').innerHTML = '<option value="ALL">Minden (Kivétel a mappából)</option>';
        
        albums.forEach(a => {
            selects.forEach(id => { document.getElementById(id).innerHTML += `<option value="${a}">${a}</option>`; });
            document.getElementById('move-album-select').innerHTML += `<option value="${a}">${a}</option>`;
        });
    }

    async function createAlbum(type) {
        const name = prompt("Mappa neve:");
        if(!name || name.trim() === '') return;
        if(albums.includes(name.trim())) { alert("Ez a mappa már létezik!"); return; }
        albums.push(name.trim()); await saveAlbums(); renderAlbumSelects();
        
        const selId = type === 'image' ? 'album-select' : 'video-album-select';
        document.getElementById(selId).value = name.trim();
        changeAlbum(type);
    }

    async function deleteAlbum(type) {
        const selId = type === 'image' ? 'album-select' : 'video-album-select';
        const sel = document.getElementById(selId).value;
        if (sel === 'ALL') return;
        if (!confirm(`Biztosan törlöd a "${sel}" mappát?\n\nA benne lévő fájlok visszakerülnek a főkönyvtárba!`)) return;

        albums = albums.filter(a => a !== sel); await saveAlbums();

        // Képek és Videók frissítése
        const stores = ['images', 'videos'];
        for (let storeName of stores) {
            await new Promise(resolve => {
                const req = db.transaction([storeName], 'readwrite').objectStore(storeName).openCursor();
                req.onsuccess = async e => {
                    const cursor = e.target.result;
                    if(cursor) {
                        const rec = cursor.value;
                        let recAlbum = rec.album ? (typeof rec.album === 'string' ? rec.album : await decryptText(rec.album, sessionKeyMaterial)) : null;
                        if(recAlbum === sel) { rec.album = null; cursor.update(rec); }
                        cursor.continue();
                    } else { resolve(); }
                };
            });
        }
        renderAlbumSelects(); document.getElementById(selId).value = 'ALL'; changeAlbum(type);
    }

    function changeAlbum(type) {
        if(type === 'image') {
            const sel = document.getElementById('album-select').value;
            localStorage.setItem('last_album_image', sel);
            document.getElementById('del-album-btn').style.display = (sel !== 'ALL') ? 'block' : 'none';
            openGallery(); 
        } else {
            const sel = document.getElementById('video-album-select').value;
            localStorage.setItem('last_album_video', sel);
            document.getElementById('del-video-album-btn').style.display = (sel !== 'ALL') ? 'block' : 'none';
            openVideoGallery(); 
        }
    }

    window.onload = () => { if(!localStorage.getItem('appSetup')) { document.getElementById('login-text').innerText = "Hozd létre a mesterjelszavad"; } checkLockout(); };

    function showView(viewId) {

    // --- EGYESÍTETT FELTÖLTŐ MOTOR (Kép + Videó Darabolás) ---
    async function handleMediaUpload(event) {
        const files = event.target.files; if (!files.length) return;
        document.getElementById('upload-status').innerText = `${files.length} fájl feldolgozása...`;
        
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            document.getElementById('upload-status').innerText = `Titkosítás: ${i + 1} / ${files.length} (${file.type.startsWith('video/') ? 'Videó' : 'Kép'})`;
            
            if (file.type.startsWith('video/')) {
                // VIDEÓ MOTOR (A Titkos Mozi)
                const currentAlbum = document.getElementById('video-album-select').value;
                const thumbBase64 = await generateVideoThumbnail(file) || "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"; // Biztonsági üres kép
                
                const encThumb = await encryptData(new TextEncoder().encode(thumbBase64), sessionKeyMaterial);
                const encAlbum = currentAlbum !== 'ALL' ? await encryptText(currentAlbum, sessionKeyMaterial) : null;
                const encName = await encryptText(file.name, sessionKeyMaterial);
                const encType = await encryptText(file.type, sessionKeyMaterial);
                
                const videoId = "vid_" + Date.now() + "_" + Math.floor(Math.random()*10000);
                const chunkSize = 5 * 1024 * 1024; // 5 MB-os szeletek
                const totalChunks = Math.ceil(file.size / chunkSize);

                for (let c = 0; c < totalChunks; c++) {
                    document.getElementById('upload-status').innerText = `Szeletelés: ${c + 1}/${totalChunks}...`;
                    const chunkBlob = file.slice(c * chunkSize, (c + 1) * chunkSize);
                    const chunkBuffer = await chunkBlob.arrayBuffer();
                    const encChunk = await encryptData(chunkBuffer, sessionKeyMaterial); // ITT KAP EGYEDI IV-t!
                    
                    await new Promise(resolve => {
                        const tx = db.transaction(['video_chunks'], 'readwrite');
                        tx.objectStore('video_chunks').add({ videoId: videoId, chunkIndex: c, data: encChunk });
                        tx.oncomplete = resolve;
                    });
                }
                
                await new Promise(resolve => {
                    const tx = db.transaction(['videos'], 'readwrite');
                    tx.objectStore('videos').add({ id: videoId, version: 3, thumb: encThumb, album: encAlbum, name: encName, mime: encType, chunks: totalChunks });
                    tx.oncomplete = resolve;
                });

            } else {
                // KÉP MOTOR
                const currentAlbum = document.getElementById('album-select').value;
                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const thumbBase64 = await generateThumbnail(e.target.result);
                        const enc = new TextEncoder();
                        const payload = { 
                            version: 2, 
                            full: await encryptData(enc.encode(e.target.result), sessionKeyMaterial), 
                            thumb: await encryptData(enc.encode(thumbBase64), sessionKeyMaterial), 
                            album: currentAlbum !== 'ALL' ? await encryptText(currentAlbum, sessionKeyMaterial) : null 
                        };
                        const tx = db.transaction(['images'], 'readwrite');
                        tx.objectStore('images').add(payload);
                        tx.oncomplete = resolve;
                    };
                    reader.readAsDataURL(file);
                });
            }
        }
        
        document.getElementById('upload-status').innerText = "Várakozás fájlra..."; document.getElementById('media-input').value = '';
        alert("Feltöltés sikeres!"); showView('menu-view');
    }

    // --- VIDEÓ LEJÁTSZÓ MOTOR (Összefűzés Memóriában) ---
    async function openVideoPlayer(videoId) {
        document.getElementById(activeMoveType === 'image' ? 'gallery-view' : 'video-gallery-view').classList.remove('active');
        document.getElementById('video-player-view').classList.add('active');
        
        const loader = document.getElementById('video-loader');
        const progressEl = document.getElementById('video-progress');
        const videoEl = document.getElementById('fs-video');
        
        loader.style.display = "block"; videoEl.style.display = "none"; videoEl.src = "";
        progressEl.innerText = "0%";

        const videoMeta = await new Promise(r => { db.transaction(['videos'], 'readonly').objectStore('videos').get(videoId).onsuccess = e => r(e.target.result); });
        if(!videoMeta) { loader.innerText = "Hiba: Videó nem található!"; return; }

        const mime = await decryptText(videoMeta.mime, sessionKeyMaterial) || 'video/mp4';
        let decryptedChunks = [];
        
        // Összegyűjtjük a szeleteket az adatbázisból
        const chunks = await new Promise(r => {
            const result = [];
            db.transaction(['video_chunks'], 'readonly').objectStore('video_chunks').index('videoId').openCursor(IDBKeyRange.only(videoId)).onsuccess = e => {
                const cursor = e.target.result;
                if(cursor) { result.push(cursor.value); cursor.continue(); } else r(result);
            }
        });
        
        // Sorba rendezzük, nehogy összekeveredjen
        chunks.sort((a,b) => a.chunkIndex - b.chunkIndex);

        for(let i = 0; i < chunks.length; i++) {
            progressEl.innerText = `${Math.round(((i + 1) / chunks.length) * 100)}%`;
            const decBuf = await decryptData(chunks[i].data, sessionKeyMaterial);
            if(decBuf) decryptedChunks.push(decBuf);
            // Egy pici levegőt hagyunk a böngészőnek, hogy ne fagyjon ki a UI
            if (i % 5 === 0) await new Promise(res => setTimeout(res, 5)); 
        }

        // Összefűzés egyetlen privát Memória-buborékká
        const videoBlob = new Blob(decryptedChunks, { type: mime });
        decryptedChunks = []; // Azonnal felszabadítjuk a darabok memóriáját!
        
        activeVideoUrl = URL.createObjectURL(videoBlob);
        loader.style.display = "none";
        videoEl.style.display = "block";
        videoEl.src = activeVideoUrl;
        videoEl.play().catch(()=>{}); // Automatikus indítás (ha az iOS engedi)
    }

                    type: 'image', version: 2, album: album, 
                    full: { salt: Array.from(newFull.salt), iv: Array.from(newFull.iv), data: await getBase64Safe(newFull.data) },
                    thumb: { salt: Array.from(newThumb.salt), iv: Array.from(newThumb.iv), data: await getBase64Safe(newThumb.data) }
                };
                blobParts.push(JSON.stringify(serRec) + (i < selected.length - 1 ? "," : ""));
            } else {
                // Videó exportálása: Szeletek beolvasása, dekódolása, újra-kódolása a küldési jelszóval. (Memória-intenzív lehet, kis videóknál működik tökéletesen)
                const rec = await new Promise(r => { db.transaction(['videos'],'readonly').objectStore('videos').get(id).onsuccess = e => r(e.target.result); });
                if(!rec) continue;
                let album = rec.album ? await encryptText(await decryptText(rec.album, sessionKeyMaterial), exportKeyMat) : null;
                let name = await encryptText(await decryptText(rec.name, sessionKeyMaterial), exportKeyMat);
                let mime = await encryptText(await decryptText(rec.mime, sessionKeyMaterial), exportKeyMat);
                const decThumb = await decryptData(rec.thumb, sessionKeyMaterial); const newThumb = await encryptData(decThumb, exportKeyMat);
                
                // Szeletek újrakódolása
                const chunks = await new Promise(r => {
                    const result = []; db.transaction(['video_chunks'], 'readonly').objectStore('video_chunks').index('videoId').openCursor(IDBKeyRange.only(id)).onsuccess = e => {
                        const c = e.target.result; if(c) { result.push(c.value); c.continue(); } else r(result);
                    }
                });
                
                let reEncChunks = [];
                for(let chunk of chunks) {
                    const decBuf = await decryptData(chunk.data, sessionKeyMaterial);
                    const newChunkData = await encryptData(decBuf, exportKeyMat);
                    reEncChunks.push({ index: chunk.chunkIndex, salt: Array.from(newChunkData.salt), iv: Array.from(newChunkData.iv), data: await getBase64Safe(newChunkData.data) });
                }

                let serRec = { type: 'video', version: 3, album: album, name: name, mime: mime, chunksCount: rec.chunks, thumb: { salt: Array.from(newThumb.salt), iv: Array.from(newThumb.iv), data: await getBase64Safe(newThumb.data) }, chunksData: reEncChunks };
                blobParts.push(JSON.stringify(serRec) + (i < selected.length - 1 ? "," : ""));
            }
            await new Promise(res => setTimeout(res, 20)); 
        }

        blobParts.push("]"); pendingExportFile = new File([new Blob(blobParts, { type: 'application/json' })], 'ssshh_media.json', { type: 'application/json' });
        exportBtn.disabled = false; exportBtn.innerText = "📦 Kész! Kattints a megosztáshoz"; exportBtn.style.background = "var(--success)";
        exportBtn.onclick = () => {
            if (navigator.canShare && navigator.canShare({ files: [pendingExportFile] })) navigator.share({ files: [pendingExportFile] }).then(()=>resetExportUI(type)).catch(()=>resetExportUI(type));
            else { const url = URL.createObjectURL(pendingExportFile); const a = document.createElement('a'); a.href = url; a.download = 'ssshh_media.json'; a.click(); URL.revokeObjectURL(url); resetExportUI(type); }
        };
    }

    function resetExportUI(type) {
        pendingExportFile = null; document.querySelectorAll(`.gallery-container input:checked`).forEach(cb => cb.checked = false);
        const btn = document.getElementById(type === 'image' ? 'export-btn' : 'video-export-btn');
        btn.style.background = "var(--warning)"; btn.onclick = () => exportSelected(type); updateSelectionBtns(type);
    }

    // --- KIMENTÉS EREDETIBEN (Kép és Videó) ---
    let pendingOriginalFiles = [];
    async function saveOriginals(type) {
        const containerId = type === 'image' ? 'gallery-container' : 'video-gallery-container';
        const prefix = type === 'image' ? '' : 'video-';
        const selected = document.querySelectorAll(`#${containerId} input:checked`); if (selected.length === 0) return;

        if (!confirm("⚠️ FIGYELEM!\nEzzel a funkcióval a fájlokat NYÍLT, titkosítás nélküli formátumban mented ki!\nBiztosan folytatod?")) return;
        const verifyPin = prompt("Biztosíték: MESTERJELSZÓ:"); if (!verifyPin) return;
        if (await decryptText(JSON.parse(localStorage.getItem('appSetup')), await getMasterKeyMaterial(verifyPin)) !== "OK") { alert("Hibás jelszó!"); return; }

        const saveBtn = document.getElementById(`${prefix}save-original-btn`); saveBtn.innerText = "Dekódolás (0%)..."; saveBtn.disabled = true; pendingOriginalFiles = [];

        for (let i = 0; i < selected.length; i++) {
            const id = type === 'video' ? selected[i].value.replace(/'/g,"") : Number(selected[i].value);
            saveBtn.innerText = `Dekódolás (${Math.round(((i + 1) / selected.length) * 100)}%)...`;

            if(type === 'image') {
                const rec = await new Promise(r => { db.transaction(['images'],'readonly').objectStore('images').get(id).onsuccess = e => r(e.target.result); });
                if(!rec) continue;
                const decBuf = await decryptData(rec.version === 2 ? rec.full : rec, sessionKeyMaterial);
                if (decBuf) pendingOriginalFiles.push(dataURLtoFile(new TextDecoder().decode(decBuf), `kimentett_kep_${Date.now()}_${i}.jpg`));
            } else {
                const rec = await new Promise(r => { db.transaction(['videos'],'readonly').objectStore('videos').get(id).onsuccess = e => r(e.target.result); });
                if(!rec) continue;
                const name = await decryptText(rec.name, sessionKeyMaterial) || `kimentett_video_${Date.now()}_${i}.mp4`;
                const mime = await decryptText(rec.mime, sessionKeyMaterial) || 'video/mp4';
                
                const chunks = await new Promise(r => {
                    const result = []; db.transaction(['video_chunks'], 'readonly').objectStore('video_chunks').index('videoId').openCursor(IDBKeyRange.only(id)).onsuccess = e => {
                        const c = e.target.result; if(c) { result.push(c.value); c.continue(); } else r(result);
                    }
                });
                chunks.sort((a,b) => a.chunkIndex - b.chunkIndex);
                let decryptedChunks = [];
                for(let chunk of chunks) {
                    const decBuf = await decryptData(chunk.data, sessionKeyMaterial);
                    if(decBuf) decryptedChunks.push(decBuf);
                }
                pendingOriginalFiles.push(new File([new Blob(decryptedChunks, { type: mime })], name, { type: mime }));
            }
            await new Promise(res => setTimeout(res, 20)); 
        }

        saveBtn.disabled = false; saveBtn.innerText = "✅ Kattints a mentéshez!"; saveBtn.style.background = "var(--success)";
        saveBtn.onclick = () => {
            if (navigator.canShare && navigator.canShare({ files: pendingOriginalFiles })) {
                navigator.share({ files: pendingOriginalFiles }).then(()=>resetSaveOrigUI(type)).catch(()=>resetSaveOrigUI(type));
            } else {
                pendingOriginalFiles.forEach(f => { const url = URL.createObjectURL(f); const a = document.createElement('a'); a.href = url; a.download = f.name; a.click(); URL.revokeObjectURL(url); });
                resetSaveOrigUI(type);
            }
        };
    }

    function resetSaveOrigUI(type) {
        pendingOriginalFiles = []; document.querySelectorAll(`.gallery-container input:checked`).forEach(cb => cb.checked = false);
        const btn = document.getElementById(type === 'image' ? 'save-original-btn' : 'video-save-original-btn');
        btn.style.background = "var(--info)"; btn.onclick = () => saveOriginals(type); updateSelectionBtns(type);
    }

    // --- IMPORTÁLÁS (Kép, Videó, Jegyzet Automata szétválogató) ---
    let pendingImportData = null;
    function loadImportFile(event) {
        const file = event.target.files[0]; if (!file) return; document.getElementById('import-filename').innerText = file.name;
        const reader = new FileReader(); reader.onload = (e) => { try { pendingImportData = JSON.parse(e.target.result); } catch (err) { alert("Érvénytelen fájl!"); pendingImportData = null; } }; reader.readAsText(file);
    }

    async function processImport() {
        if (!pendingImportData) { alert("Előbb válassz ki egy fájlt!"); return; }
        const senderPin = document.getElementById('import-pin').value; if (!senderPin) return;
        document.getElementById('import-status').innerText = "Feldolgozás és Átkódolás...";
        const senderMat = await getMasterKeyMaterial(senderPin); let successCount = 0; let failCount = 0;

        for (let rec of pendingImportData) {
            try {
                if (rec.type === 'note') {
                    const title = await decryptText(rec.title, senderMat); const content = await decryptText(rec.content, senderMat);
                    if (title !== null && content !== null) {
                        await new Promise(r => { db.transaction(['notes'], 'readwrite').objectStore('notes').add({ title: await encryptText(title, sessionKeyMaterial), content: await encryptText(content, sessionKeyMaterial), timestamp: rec.timestamp }).onsuccess = r; });
                        successCount++;
                    } else failCount++;
                } else if (rec.type === 'video') {
                    const album = rec.album ? await decryptText(rec.album, senderMat) : null;
                    const name = await decryptText(rec.name, senderMat); const mime = await decryptText(rec.mime, senderMat);
                    
                    let thumbDec = { salt: new Uint8Array(rec.thumb.salt), iv: new Uint8Array(rec.thumb.iv), data: await base64ToBufferAsync(rec.thumb.data) };
                    const decThumbBuf = await decryptData(thumbDec, senderMat);
                    if(decThumbBuf && name) {
                        const videoId = "vid_" + Date.now() + "_" + Math.floor(Math.random()*10000);
                        if (album && !albums.includes(album)) { albums.push(album); await saveAlbums(); }
                        
                        for(let chunk of rec.chunksData) {
                            let chunkDec = { salt: new Uint8Array(chunk.salt), iv: new Uint8Array(chunk.iv), data: await base64ToBufferAsync(chunk.data) };
                            const decChunkBuf = await decryptData(chunkDec, senderMat);
                            await new Promise(r => { db.transaction(['video_chunks'], 'readwrite').objectStore('video_chunks').add({ videoId: videoId, chunkIndex: chunk.index, data: await encryptData(decChunkBuf, sessionKeyMaterial) }).onsuccess = r; });
                        }
                        
                        await new Promise(r => { db.transaction(['videos'], 'readwrite').objectStore('videos').add({ id: videoId, version: 3, thumb: await encryptData(decThumbBuf, sessionKeyMaterial), album: album ? await encryptText(album, sessionKeyMaterial) : null, name: await encryptText(name, sessionKeyMaterial), mime: await encryptText(mime, sessionKeyMaterial), chunks: rec.chunksCount }).onsuccess = r; });
                        successCount++;
                    } else failCount++;
                } else {
                    // Kép (type === 'image' vagy undefined régi verzióknál)
                    let exportedFull = rec.version === 2 ? rec.full : rec; let exportedThumb = rec.version === 2 ? rec.thumb : rec;
                    let fullDec = { salt: new Uint8Array(exportedFull.salt), iv: new Uint8Array(exportedFull.iv), data: typeof exportedFull.data === 'string' ? await base64ToBufferAsync(exportedFull.data) : new Uint8Array(exportedFull.data) };
                    let thumbDec = { salt: new Uint8Array(exportedThumb.salt), iv: new Uint8Array(exportedThumb.iv), data: typeof exportedThumb.data === 'string' ? await base64ToBufferAsync(exportedThumb.data) : new Uint8Array(exportedThumb.data) };
                    
                    const decFullBuf = await decryptData(fullDec, senderMat); const decThumbBuf = await decryptData(thumbDec, senderMat);
                    if (decFullBuf && decThumbBuf) {
                        const album = rec.album ? await decryptText(rec.album, senderMat) : null;
                        if (album && !albums.includes(album)) { albums.push(album); await saveAlbums(); }
                        await new Promise(r => { db.transaction(['images'], 'readwrite').objectStore('images').add({ version: 2, full: await encryptData(decFullBuf, sessionKeyMaterial), thumb: await encryptData(decThumbBuf, sessionKeyMaterial), album: album ? await encryptText(album, sessionKeyMaterial) : null }).onsuccess = r; });
                        successCount++;
                    } else failCount++;
                }
            } catch(e) { failCount++; }
        }

        document.getElementById('import-status').innerText = ""; document.getElementById('import-pin').value = ''; document.getElementById('import-file-input').value = ''; document.getElementById('import-filename').innerText = ''; pendingImportData = null;
        alert(`Importálás befejezve!\nSikeres: ${successCount}\nHibás jelszó: ${failCount}`); renderAlbumSelects(); showView('menu-view');
    }
</script>
