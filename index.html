<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Titkos Galéria</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Galéria">
    <link rel="apple-touch-icon" href="./appstore.png">
    
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --primary: #0a84ff; --danger: #ff453a; --success: #32d74b; --warning: #ff9f0a; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; text-align: center; }
        
        button, input, select { touch-action: manipulation; }

        .view { display: none; max-width: 500px; margin: 0 auto; padding-top: 20px; }
        .active { display: block; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        input[type="password"] { width: 100%; padding: 15px; font-size: 20px; text-align: center; border-radius: 10px; border: none; box-sizing: border-box; margin-bottom: 15px; background: #333; color: white; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: bold; margin-bottom: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button.secondary { background: #333; }
        button.danger { background: var(--danger); }
        button.warning { background: var(--warning); }
        select { width: 100%; padding: 15px; border-radius: 10px; font-size: 16px; background: #333; color: white; border: none; margin-bottom: 15px; box-sizing: border-box; }
        
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; margin-bottom: 15px; }
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }
        .file-upload-btn { background: var(--primary); color: white; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; display: block; width: 100%; box-sizing: border-box; }
        
        #gallery-header { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
        #gallery-header select { margin-bottom: 0; flex: 1; }
        #gallery-header button { width: auto; margin-bottom: 0; padding: 12px 15px; }

        #gallery-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 120px; }
        .img-card { position: relative; width: 100%; height: 150px; border-radius: 10px; overflow: hidden; border: 1px solid #333; background: #222; }
        .img-card img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        .img-card input[type="checkbox"] { position: absolute; top: 10px; right: 10px; width: 25px; height: 25px; z-index: 10; accent-color: var(--primary); }
        
        .gallery-actions { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: #1e1e1e; 
            padding: 10px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 5px; 
            justify-content: center; z-index: 100; border-top: 1px solid #333;
            padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 10px);
        }
        .gallery-actions button { flex: 1 1 calc(30% - 10px); font-size: 13px; padding: 12px 5px; margin: 0; }
        
        #status-msg { color: var(--success); font-size: 14px; margin-top: 10px; height: 20px; }

        #fullscreen-view { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000000; z-index: 200; display: none; 
            align-items: center; justify-content: center; overflow: hidden; 
        }
        #fullscreen-view.active { display: flex; }
        #fs-img { max-width: 100%; max-height: 100%; object-fit: contain; z-index: 201; }
        .fs-close { 
            position: absolute; top: calc(env(safe-area-inset-top, 20px) + 10px); right: 20px; 
            background: rgba(255,255,255,0.2); border: none; color: white; font-size: 18px; 
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 203; 
            display: flex; align-items: center; justify-content: center; padding: 0;
        }
        #fs-loader { position: absolute; color: white; font-size: 16px; z-index: 202; display: none; }
    </style>
</head>
<body>

    <div id="login-view" class="view active">
        <h1>🔒 Titkos Galéria</h1>
        <p id="login-text">Add meg a jelszavad</p>
        <input type="password" id="pin-input" placeholder="Jelszó...">
        <button onclick="login()">Belépés</button>
        <div id="status-msg"></div>
    </div>

    <div id="menu-view" class="view">
        <h1>Főmenü</h1>
        <button onclick="showView('upload-view')">📸 Új kép hozzáadása</button>
        <button onclick="showView('import-view')">📥 Mentés Importálása</button>
        <button onclick="openGallery()">🖼️ Képek megtekintése</button>
        <button class="danger" onclick="logout()">Kijelentkezés</button>
    </div>

    <div id="move-view" class="view">
        <h1>Áthelyezés mappába</h1>
        <p style="color: gray; font-size: 14px;">Hova szeretnéd áthelyezni a kijelölt képeket?</p>
        <select id="move-album-select"></select>
        <button onclick="executeMove()">Áthelyezés</button>
        <button class="secondary" onclick="showView('gallery-view')">Mégsem</button>
    </div>

    <div id="import-view" class="view">
        <h1>📥 Importálás</h1>
        <p style="font-size: 14px; color: gray;">Válaszd ki a kapott titkosított fájlt, majd add meg a feladó jelszavát!</p>
        
        <div class="file-upload-wrapper">
            <button class="file-upload-btn">Titkosított fájl kiválasztása</button>
            <input type="file" accept=".json,application/json" id="import-file-input" onchange="loadImportFile(event)">
        </div>
        <p id="import-filename" style="font-size: 14px; color: var(--primary); margin-bottom: 15px;"></p>
        
        <input type="password" id="import-pin" placeholder="A feladó jelszava...">
        <button class="warning" onclick="processImport()">Importálás és Feloldás</button>
        <p id="import-status" style="font-size: 14px; color: var(--primary);"></p>
        <button class="secondary" onclick="showView('menu-view')">Vissza a menübe</button>
    </div>

    <div id="upload-view" class="view">
        <h1>Kép titkosítása</h1>
        <div class="file-upload-wrapper">
            <button class="file-upload-btn">Kiválasztás vagy Fotózás</button>
            <input type="file" accept="image/*" id="image-input" multiple onchange="handleImage(event)">
        </div>
        <p id="upload-status" style="font-size: 14px; color: gray;">Várakozás képre...</p>
        <button class="secondary" onclick="showView('menu-view')">Vissza a menübe</button>
    </div>

    <div id="gallery-view" class="view">
        <div id="gallery-header">
            <select id="album-select" onchange="changeAlbum()">
                <option value="ALL">Minden Kép</option>
            </select>
            <button onclick="createAlbum()">+ Új</button>
            <button id="del-album-btn" class="danger" onclick="deleteAlbum()" style="display:none;">Törlés</button>
        </div>

        <div id="gallery-container"></div>
        
        <div class="gallery-actions">
            <button class="secondary" onclick="showView('menu-view')">Vissza</button>
            <button class="secondary" id="select-all-btn" onclick="toggleSelectAll()">Összes kijelölése</button>
            <button class="primary" id="move-btn" style="display:none;" onclick="showMoveModal()">Mozgatás</button>
            <button class="warning" id="export-btn" style="display:none;" onclick="exportSelected()">Küldés</button>
            <button class="danger" id="delete-btn" style="display:none;" onclick="deleteSelected()">Törlés</button>
        </div>
    </div>

    <div id="fullscreen-view">
        <button class="fs-close" onclick="closeFullscreen()">✕</button>
        <div id="fs-loader">Betöltés...</div>
        <img id="fs-img" src="">
    </div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                reg.onupdatefound = () => {
                    const installingWorker = reg.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    };
                };
            });
        });
    }

    let sessionKey = null;
    let db;
    let currentGalleryIds = [];
    let currentImgIndex = 0;
    let isAllSelected = false;

    // Albums are kept ONLY in memory after login — never in plaintext on disk
    let albums = [];

    // ─── BRUTE-FORCE LOCKOUT ─────────────────────────────────────────────────
    const MAX_ATTEMPTS    = 5;
    const BASE_LOCKOUT_MS = 5 * 60 * 1000; // 5 minutes, doubles each extra attempt

    function getLockoutData() {
        try { return JSON.parse(localStorage.getItem('_lk') || '{"a":0,"u":0}'); }
        catch(e) { return { a: 0, u: 0 }; }
    }

    /** Returns seconds remaining if locked, 0 if free. */
    function checkLockout() {
        const d = getLockoutData();
        const now = Date.now();
        if (d.u > now) return Math.ceil((d.u - now) / 1000);
        if (d.u > 0 && d.u <= now) localStorage.removeItem('_lk'); // expired, clean up
        return 0;
    }

    function recordFailedAttempt() {
        const d = getLockoutData();
        d.a = (d.a || 0) + 1;
        if (d.a >= MAX_ATTEMPTS) {
            const extra = d.a - MAX_ATTEMPTS; // 0, 1, 2 … → 1×, 2×, 4× base duration
            d.u = Date.now() + BASE_LOCKOUT_MS * Math.pow(2, extra);
        }
        localStorage.setItem('_lk', JSON.stringify(d));
    }

    function resetLockout() {
        localStorage.removeItem('_lk');
    }

    // ─── CRYPTO HELPERS ──────────────────────────────────────────────────────
    function bufferToBase64(buf) {
        return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.readAsDataURL(new Blob([buf]));
        });
    }

    function base64ToBuffer(b64) {
        const binstr = atob(b64);
        const buf = new Uint8Array(binstr.length);
        for (let i = 0; i < binstr.length; i++) buf[i] = binstr.charCodeAt(i);
        return buf;
    }

    async function getBase64Safe(data) {
        let safeData = data;
        if (Array.isArray(data)) safeData = new Uint8Array(data);
        return await bufferToBase64(safeData);
    }

    async function deriveKey(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
            "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits", "deriveKey"]
        );
        return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
            keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
        );
    }

    async function encryptData(dataString, password) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv   = crypto.getRandomValues(new Uint8Array(12));
        const key  = await deriveKey(password, salt);
        const enc  = new TextEncoder();
        const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(dataString));
        return { salt, iv, data: new Uint8Array(encrypted) };
    }

    async function decryptData(encryptedObj, password) {
        try {
            const salt = new Uint8Array(encryptedObj.salt);
            const iv   = new Uint8Array(encryptedObj.iv);
            const data = new Uint8Array(encryptedObj.data);
            const key  = await deriveKey(password, salt);
            const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
            return new TextDecoder().decode(decrypted);
        } catch (e) { return null; }
    }

    // ─── ALBUM ENCRYPTION HELPERS ─────────────────────────────────────────────
    /**
     * Encrypt an album name with the current sessionKey.
     * Returns a plain serialisable object {salt, iv, data} or null.
     */
    async function encryptAlbum(albumName) {
        if (!albumName || !sessionKey) return null;
        const enc = await encryptData(albumName, sessionKey);
        return {
            salt: Array.from(enc.salt),
            iv:   Array.from(enc.iv),
            data: Array.from(enc.data)
        };
    }

    /**
     * Decrypt an album field from a DB record.
     * Handles: null → null, plain string (legacy) → as-is, encrypted object → decrypt.
     */
    async function decryptAlbum(encObj) {
        if (!encObj) return null;
        if (typeof encObj === 'string') return encObj; // backwards-compat with old records
        return await decryptData(encObj, sessionKey);
    }

    // ─── ALBUM STORAGE (encrypted in localStorage) ───────────────────────────
    async function saveAlbums() {
        if (!sessionKey) return;
        const enc = await encryptData(JSON.stringify(albums), sessionKey);
        localStorage.setItem('gallery_albums', JSON.stringify({
            salt: Array.from(enc.salt),
            iv:   Array.from(enc.iv),
            data: Array.from(enc.data)
        }));
    }

    async function loadAlbums() {
        const raw = localStorage.getItem('gallery_albums');
        if (!raw) { albums = []; return; }
        try {
            const parsed = JSON.parse(raw);
            // Legacy: if it's a plain array, migrate it to encrypted form
            if (Array.isArray(parsed)) {
                albums = parsed;
                await saveAlbums();
                return;
            }
            const decrypted = await decryptData(parsed, sessionKey);
            albums = decrypted ? JSON.parse(decrypted) : [];
        } catch(e) { albums = []; }
    }

    // ─── INDEXEDDB SETUP ─────────────────────────────────────────────────────
    const dbRequest = indexedDB.open("SecureGalleryDB", 1);
    dbRequest.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('images')) {
            d.createObjectStore('images', { autoIncrement: true });
        }
    };
    dbRequest.onsuccess = (e) => { db = e.target.result; };

    // ─── ALBUM UI ────────────────────────────────────────────────────────────
    function renderAlbumSelects() {
        const mainSelect = document.getElementById('album-select');
        const moveSelect = document.getElementById('move-album-select');
        mainSelect.innerHTML = '<option value="ALL">Minden Kép</option>';
        moveSelect.innerHTML = '';
        albums.forEach(a => {
            mainSelect.innerHTML += `<option value="${a}">${a}</option>`;
            moveSelect.innerHTML += `<option value="${a}">${a}</option>`;
        });
    }

    async function createAlbum() {
        const name = prompt("Mappa neve:");
        if (!name || name.trim() === '') return;
        if (albums.includes(name.trim())) { alert("Ez a mappa már létezik!"); return; }
        albums.push(name.trim());
        await saveAlbums();
        renderAlbumSelects();
        document.getElementById('album-select').value = name.trim();
        changeAlbum();
    }

    async function deleteAlbum() {
        const sel = document.getElementById('album-select').value;
        if (sel === 'ALL') return;
        if (!confirm(`Biztosan törlöd a "${sel}" mappát?\n\nA benne lévő képek nem törlődnek, csak visszakerülnek a Minden Kép közé!`)) return;

        albums = albums.filter(a => a !== sel);
        await saveAlbums();

        // Fetch all records, decrypt album fields, null-out matching ones
        const allRecords = await new Promise(resolve => {
            const t = db.transaction(['images'], 'readonly');
            t.objectStore('images').getAll().onsuccess = e => resolve(e.target.result);
        });
        const allKeys = await new Promise(resolve => {
            const t = db.transaction(['images'], 'readonly');
            t.objectStore('images').getAllKeys().onsuccess = e => resolve(e.target.result);
        });

        const toUpdate = [];
        for (let i = 0; i < allRecords.length; i++) {
            const albumName = await decryptAlbum(allRecords[i].album);
            if (albumName === sel) {
                allRecords[i].album = null;
                toUpdate.push({ key: allKeys[i], record: allRecords[i] });
            }
        }

        if (toUpdate.length > 0) {
            const t = db.transaction(['images'], 'readwrite');
            const store = t.objectStore('images');
            for (const item of toUpdate) store.put(item.record, item.key);
            await new Promise(resolve => { t.oncomplete = resolve; });
        }

        renderAlbumSelects();
        document.getElementById('album-select').value = 'ALL';
        changeAlbum();
    }

    function changeAlbum() {
        const sel = document.getElementById('album-select').value;
        document.getElementById('del-album-btn').style.display = (sel !== 'ALL') ? 'block' : 'none';
        openGallery();
    }

    // ─── THUMBNAIL ───────────────────────────────────────────────────────────
    function generateThumbnail(base64Image, maxWidth = 300) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const scale  = Math.min(maxWidth / img.width, 1);
                canvas.width  = img.width  * scale;
                canvas.height = img.height * scale;
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                const result = canvas.toDataURL('image/jpeg', 0.5);
                canvas.width = 0; canvas.height = 0; img.src = '';
                resolve(result);
            };
            img.src = base64Image;
        });
    }

    // ─── INIT ─────────────────────────────────────────────────────────────────
    window.onload = () => {
        if (!localStorage.getItem('appSetup')) {
            document.getElementById('login-text').innerText = "Hozd létre a mesterjelszavad";
        }
        renderAlbumSelects();
    };

    function showView(viewId) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById('fullscreen-view').classList.remove('active');
        document.getElementById(viewId).classList.add('active');
    }

    // ─── LOGIN / LOGOUT ───────────────────────────────────────────────────────
    async function login() {
        const pin = document.getElementById('pin-input').value;
        if (!pin) return;

        // Check lockout first
        const remaining = checkLockout();
        if (remaining > 0) {
            const mins = Math.ceil(remaining / 60);
            document.getElementById('status-msg').style.color = 'var(--danger)';
            document.getElementById('status-msg').innerText =
                `Túl sok hibás próbálkozás. Várj ${mins} percet.`;
            document.getElementById('pin-input').value = '';
            return;
        }

        const statusEl = document.getElementById('status-msg');

        if (!localStorage.getItem('appSetup')) {
            // First run — set up password
            const verificationToken = await encryptData("OK", pin);
            localStorage.setItem('appSetup', JSON.stringify({
                salt: Array.from(verificationToken.salt),
                iv:   Array.from(verificationToken.iv),
                data: Array.from(verificationToken.data)
            }));
            sessionKey = pin;
            await loadAlbums();
            renderAlbumSelects();
            showView('menu-view');
        } else {
            const savedToken = JSON.parse(localStorage.getItem('appSetup'));
            const result = await decryptData(savedToken, pin);
            if (result === "OK") {
                resetLockout();
                sessionKey = pin;
                await loadAlbums();
                renderAlbumSelects();
                showView('menu-view');
            } else {
                recordFailedAttempt();
                const d = getLockoutData();
                const remaining2 = checkLockout();
                if (remaining2 > 0) {
                    statusEl.style.color = 'var(--danger)';
                    statusEl.innerText = `Fiók zárolva ${Math.ceil(remaining2 / 60)} percre.`;
                } else {
                    const left = MAX_ATTEMPTS - d.a;
                    statusEl.style.color = 'var(--warning)';
                    statusEl.innerText = left > 0
                        ? `Hibás jelszó! Még ${left} próbálkozás.`
                        : 'Hibás jelszó!';
                }
            }
        }
        document.getElementById('pin-input').value = '';
    }

    function logout() {
        sessionKey = null;
        currentGalleryIds = [];
        albums = [];
        renderAlbumSelects();
        document.getElementById('status-msg').innerText = '';
        document.getElementById('status-msg').style.color = 'var(--success)';
        showView('login-view');
    }

    // ─── UPLOAD ───────────────────────────────────────────────────────────────
    async function handleImage(event) {
        const files = event.target.files;
        if (!files.length) return;

        document.getElementById('upload-status').innerText = `${files.length} kép feldolgozása...`;

        for (let i = 0; i < files.length; i++) {
            document.getElementById('upload-status').innerText = `Titkosítás: ${i + 1} / ${files.length}`;
            await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const originalBase64 = e.target.result;
                    const thumbBase64    = await generateThumbnail(originalBase64);
                    const encryptedFull  = await encryptData(originalBase64, sessionKey);
                    const encryptedThumb = await encryptData(thumbBase64,    sessionKey);
                    const payload = { version: 2, full: encryptedFull, thumb: encryptedThumb, album: null };
                    const transaction = db.transaction(['images'], 'readwrite');
                    transaction.objectStore('images').add(payload);
                    transaction.oncomplete = resolve;
                };
                reader.readAsDataURL(files[i]);
            });
        }

        document.getElementById('upload-status').innerText = "Várakozás képre...";
        document.getElementById('image-input').value = '';
        alert("Feltöltés sikeres!");
        showView('menu-view');
    }

    // ─── GALLERY ──────────────────────────────────────────────────────────────
    function openGallery() {
        showView('gallery-view');
        const container = document.getElementById('gallery-container');
        container.innerHTML = '<p id="loading-text" style="grid-column: span 2;">Képek betöltése...</p>';
        isAllSelected = false;
        updateSelectionBtns();
        currentGalleryIds = [];

        const currentAlbum = document.getElementById('album-select').value;
        const transaction  = db.transaction(['images'], 'readonly');
        transaction.objectStore('images').getAllKeys().onsuccess = async (e) => {
            const keys = e.target.result;
            if (!keys || keys.length === 0) {
                container.innerHTML = '<p style="grid-column: span 2;">Üres a galéria.</p>';
                return;
            }
            for (const id of keys) {
                await renderSingleThumbnail(id, container, currentAlbum);
                await new Promise(res => setTimeout(res, 10));
            }
            const loadingText = document.getElementById('loading-text');
            if (loadingText) loadingText.remove();
            if (currentGalleryIds.length === 0) {
                container.innerHTML = '<p style="grid-column: span 2;">Ebben a mappában nincsenek képek.</p>';
            }
        };
    }

    function renderSingleThumbnail(id, container, currentAlbum) {
        return new Promise((resolve) => {
            const transaction = db.transaction(['images'], 'readonly');
            transaction.objectStore('images').get(id).onsuccess = async (e) => {
                const record = e.target.result;
                if (record) {
                    // Decrypt album field before comparing — never trust plaintext
                    const recAlbumName = await decryptAlbum(record.album);
                    const recAlbum     = recAlbumName || 'ALL';

                    if (currentAlbum !== 'ALL' && recAlbum !== currentAlbum) {
                        resolve(); return;
                    }

                    const dataToDecrypt = record.version === 2 ? record.thumb : record;
                    const base64Thumb   = await decryptData(dataToDecrypt, sessionKey);

                    if (base64Thumb) {
                        const index = currentGalleryIds.length;
                        currentGalleryIds.push(id);
                        const card = document.createElement('div');
                        card.className = 'img-card';
                        card.innerHTML = `<input type="checkbox" value="${id}" onchange="updateSelectionBtns()"><img src="${base64Thumb}" onclick="openFullscreen(${index})">`;
                        container.appendChild(card);
                    }
                }
                resolve();
            };
        });
    }

    // ─── SELECTION ───────────────────────────────────────────────────────────
    function toggleSelectAll() {
        const checkboxes = document.querySelectorAll('#gallery-container input[type="checkbox"]');
        isAllSelected = !isAllSelected;
        checkboxes.forEach(cb => cb.checked = isAllSelected);
        updateSelectionBtns();
    }

    function updateSelectionBtns() {
        const selected  = document.querySelectorAll('#gallery-container input:checked');
        const allBoxes  = document.querySelectorAll('#gallery-container input[type="checkbox"]');
        const delBtn    = document.getElementById('delete-btn');
        const expBtn    = document.getElementById('export-btn');
        const moveBtn   = document.getElementById('move-btn');
        const selAllBtn = document.getElementById('select-all-btn');

        if (selected.length === allBoxes.length && allBoxes.length > 0) {
            isAllSelected = true;
            selAllBtn.innerText = "Kijelölés törlése";
        } else {
            isAllSelected = false;
            selAllBtn.innerText = "Összes kijelölése";
        }

        if (selected.length > 0) {
            delBtn.style.display  = 'block';
            expBtn.style.display  = 'block';
            moveBtn.style.display = 'block';
            delBtn.innerText  = `Törlés (${selected.length})`;
            expBtn.innerText  = `Küldés (${selected.length})`;
            moveBtn.innerText = `Mozgatás (${selected.length})`;
        } else {
            delBtn.style.display  = 'none';
            expBtn.style.display  = 'none';
            moveBtn.style.display = 'none';
        }
    }

    // ─── MOVE ────────────────────────────────────────────────────────────────
    function showMoveModal() {
        if (albums.length === 0) { alert("Nincs még létrehozott mappád!\nCsinálj egyet a '+ Új' gombbal."); return; }
        renderAlbumSelects();
        showView('move-view');
    }

    async function executeMove() {
        const targetAlbum    = document.getElementById('move-album-select').value;
        const selected       = document.querySelectorAll('#gallery-container input:checked');
        const encAlbum       = await encryptAlbum(targetAlbum); // encrypt album name
        const transaction    = db.transaction(['images'], 'readwrite');
        const store          = transaction.objectStore('images');
        let movedCount = 0;

        for (const cb of selected) {
            const id = Number(cb.value);
            await new Promise(resolve => {
                store.get(id).onsuccess = e => {
                    const rec = e.target.result;
                    if (rec) {
                        rec.album = encAlbum; // store encrypted album
                        store.put(rec, id).onsuccess = resolve;
                    } else { resolve(); }
                };
            });
            movedCount++;
        }

        alert(`${movedCount} kép áthelyezve ide: ${targetAlbum}`);
        showView('gallery-view');
        openGallery();
    }

    // ─── EXPORT ───────────────────────────────────────────────────────────────
    async function exportSelected() {
        const selected  = document.querySelectorAll('#gallery-container input:checked');
        if (selected.length === 0) return;

        const exportBtn = document.getElementById('export-btn');
        exportBtn.innerText = "Csomagolás (0%)...";

        let blobParts = ["["];

        for (let i = 0; i < selected.length; i++) {
            const id = Number(selected[i].value);
            exportBtn.innerText = `Csomagolás (${Math.round(((i + 1) / selected.length) * 100)}%)...`;

            const record = await new Promise((resolve) => {
                const t = db.transaction(['images'], 'readonly');
                t.objectStore('images').get(id).onsuccess = e => resolve(e.target.result);
                t.onerror = () => resolve(null);
            });

            if (!record) continue;

            // Serialise the encrypted album field (already encrypted with sender's key)
            let serialisedAlbum = null;
            if (record.album) {
                serialisedAlbum = {
                    salt: Array.isArray(record.album.salt) ? record.album.salt : Array.from(record.album.salt),
                    iv:   Array.isArray(record.album.iv)   ? record.album.iv   : Array.from(record.album.iv),
                    data: Array.isArray(record.album.data) ? record.album.data : Array.from(record.album.data)
                };
            }

            let serializableRecord = { version: record.version, album: serialisedAlbum };

            if (record.version === 2) {
                serializableRecord.full = {
                    salt: Array.from(record.full.salt),
                    iv:   Array.from(record.full.iv),
                    data: await getBase64Safe(record.full.data)
                };
                serializableRecord.thumb = {
                    salt: Array.from(record.thumb.salt),
                    iv:   Array.from(record.thumb.iv),
                    data: await getBase64Safe(record.thumb.data)
                };
            } else {
                serializableRecord = {
                    salt:  Array.from(record.salt),
                    iv:    Array.from(record.iv),
                    data:  await getBase64Safe(record.data),
                    album: serialisedAlbum
                };
            }

            let jsonStr = JSON.stringify(serializableRecord);
            if (i < selected.length - 1) jsonStr += ",";
            blobParts.push(jsonStr);
            serializableRecord = null; jsonStr = null;
            await new Promise(res => setTimeout(res, 20));
        }

        blobParts.push("]");
        exportBtn.innerText = "Fájl átadása...";

        const blob = new Blob(blobParts, { type: 'application/json' });
        const file = new File([blob], 'titkositott_kepek.json', { type: 'application/json' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file] }).catch(err => console.log('Megosztás megszakítva', err));
        } else {
            const url = URL.createObjectURL(blob);
            const a   = document.createElement('a');
            a.href     = url;
            a.download = 'titkositott_kepek.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        document.querySelectorAll('#gallery-container input:checked').forEach(cb => cb.checked = false);
        updateSelectionBtns();
    }

    // ─── IMPORT ───────────────────────────────────────────────────────────────
    let pendingImportData = null;

    function loadImportFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        document.getElementById('import-filename').innerText = file.name;
        const reader = new FileReader();
        reader.onload = (e) => {
            try { pendingImportData = JSON.parse(e.target.result); }
            catch (err) { alert("Érvénytelen fájlformátum!"); pendingImportData = null; }
        };
        reader.readAsText(file);
    }

    async function processImport() {
        if (!pendingImportData) { alert("Előbb válassz ki egy fájlt!"); return; }
        const senderPin = document.getElementById('import-pin').value;
        if (!senderPin) { alert("Írd be a feladó jelszavát!"); return; }

        const statusEl = document.getElementById('import-status');
        statusEl.innerText = "Feldolgozás és Átkódolás...";

        let successCount = 0, failCount = 0;

        for (const record of pendingImportData) {
            let dataToDecrypt = {};

            if (record.version === 2) {
                dataToDecrypt = {
                    salt: new Uint8Array(record.full.salt),
                    iv:   new Uint8Array(record.full.iv),
                    data: typeof record.full.data === 'string'
                        ? base64ToBuffer(record.full.data)
                        : new Uint8Array(record.full.data)
                };
            } else {
                dataToDecrypt = {
                    salt: new Uint8Array(record.salt),
                    iv:   new Uint8Array(record.iv),
                    data: typeof record.data === 'string'
                        ? base64ToBuffer(record.data)
                        : new Uint8Array(record.data)
                };
            }

            const base64Full = await decryptData(dataToDecrypt, senderPin);
            if (!base64Full) { failCount++; continue; }

            // Decrypt album name using sender's pin, then re-encrypt with own key
            let importedAlbumName = null;
            if (record.album) {
                if (typeof record.album === 'string') {
                    importedAlbumName = record.album; // legacy plaintext
                } else {
                    importedAlbumName = await decryptData({
                        salt: new Uint8Array(record.album.salt),
                        iv:   new Uint8Array(record.album.iv),
                        data: new Uint8Array(record.album.data)
                    }, senderPin);
                }
            }

            const reencryptedAlbum = await encryptAlbum(importedAlbumName);

            if (importedAlbumName && !albums.includes(importedAlbumName)) {
                albums.push(importedAlbumName);
                await saveAlbums();
            }

            const thumbBase64    = await generateThumbnail(base64Full);
            const encryptedFull  = await encryptData(base64Full,   sessionKey);
            const encryptedThumb = await encryptData(thumbBase64,  sessionKey);

            const payload = { version: 2, full: encryptedFull, thumb: encryptedThumb, album: reencryptedAlbum };

            await new Promise(resolve => {
                const t = db.transaction(['images'], 'readwrite');
                t.objectStore('images').add(payload);
                t.oncomplete = resolve;
            });
            successCount++;
        }

        statusEl.innerText = "";
        document.getElementById('import-pin').value        = '';
        document.getElementById('import-file-input').value = '';
        document.getElementById('import-filename').innerText = '';
        pendingImportData = null;

        alert(`Importálás befejezve!\nSikeres: ${successCount}\nHibás jelszó: ${failCount}`);
        renderAlbumSelects();
        showView('menu-view');
    }

    // ─── DELETE ───────────────────────────────────────────────────────────────
    async function deleteSelected() {
        if (!confirm("Biztosan véglegesen törlöd a kijelölt képeket?")) return;
        const selected    = document.querySelectorAll('#gallery-container input:checked');
        const transaction = db.transaction(['images'], 'readwrite');
        const store       = transaction.objectStore('images');
        selected.forEach(cb => store.delete(Number(cb.value)));
        transaction.oncomplete = () => openGallery();
    }

    // ─── FULLSCREEN ───────────────────────────────────────────────────────────
    async function loadFullscreenImage(index) {
        const imgEl  = document.getElementById('fs-img');
        const loader = document.getElementById('fs-loader');
        imgEl.src = ""; loader.style.display = "block";

        const imageId     = currentGalleryIds[index];
        const transaction = db.transaction(['images'], 'readonly');
        transaction.objectStore('images').get(imageId).onsuccess = async (e) => {
            const record = e.target.result;
            if (record) {
                const dataToDecrypt = record.version === 2 ? record.full : record;
                const base64Full    = await decryptData(dataToDecrypt, sessionKey);
                imgEl.src = base64Full;
                loader.style.display = "none";
            }
        };
    }

    function openFullscreen(index) {
        currentImgIndex = index;
        document.getElementById('gallery-view').classList.remove('active');
        document.getElementById('fullscreen-view').classList.add('active');
        loadFullscreenImage(currentImgIndex);
    }

    function closeFullscreen() {
        document.getElementById('fullscreen-view').classList.remove('active');
        document.getElementById('gallery-view').classList.add('active');
        document.getElementById('fs-img').src = "";
    }

    function nextFsImage() {
        if (currentImgIndex < currentGalleryIds.length - 1) {
            currentImgIndex++; loadFullscreenImage(currentImgIndex);
        }
    }

    function prevFsImage() {
        if (currentImgIndex > 0) {
            currentImgIndex--; loadFullscreenImage(currentImgIndex);
        }
    }

    let touchstartX = 0, touchendX = 0, isZooming = false;
    const fsView = document.getElementById('fullscreen-view');

    fsView.addEventListener('touchstart', e => {
        if (e.touches.length > 1) { isZooming = true; }
        else { isZooming = false; touchstartX = e.changedTouches[0].screenX; }
    }, { passive: true });

    fsView.addEventListener('touchend', e => {
        if (!isZooming && e.changedTouches.length === 1) {
            touchendX = e.changedTouches[0].screenX;
            if (touchendX < touchstartX - 40) nextFsImage();
            if (touchendX > touchstartX + 40) prevFsImage();
        }
    }, { passive: true });
</script>
